# Where each series comes from.
#
# Keys are the series names used in indicators.yml. They stay the FRED codes
# so expressions like "UNRATE - NROU" read the same whatever the vendor; the
# store saves every series under this name. `use` picks the vendor for a
# series, falling back to `default`. For FRED the code is the key itself.
#
# Macrobond codes were matched on description, frequency, seasonal adjustment
# and units, preferring the longest revision history. Notes flag where the
# match is not like-for-like with the FRED series.
#
# A third vendor, `ciq`, covers what Macrobond's entitlement does not: sovereign
# CDS, ICE BofA spreads, and anything read off company financials. Its codes are
# written `identifier|mnemonic`, because a Capital IQ field needs both the
# entity and the field to resolve:
#
#   CDS5Y_US:
#     use: ciq
#     ciq: "IQ12345|IQ_CDS_SPREAD_5YR"
#
# Credentials live in CIQ_USERNAME and CIQ_PASSWORD in the environment, never in
# this file or any other file in the repo. Before adding a `ciq` series, run
# `python ingest.py ciq-probe --id ... --code ...`: the API is usually entitled
# separately from a Pro seat, and the probe answers that in seconds using the
# vendor's own error message.
#
# A fourth, `bloomberg`, reads from a Bloomberg terminal logged in on the same
# machine through the Desktop API — no credentials here, the terminal's login is
# the entitlement. Codes are a ticker, optionally `ticker|FIELD`:
#
#   CDS5Y_US:
#     use: bloomberg
#     bloomberg: "US CDS USD SR 5Y D14 Corp"
#
# It works only where a terminal runs, so the hosted app can never refresh it.
#
# LICENSING. `ingest.py publish` refuses to run while the store holds any
# `bloomberg` or `ciq` series. Anything fetched from `ciq` must be checked against the
# subscription's redistribution terms before it reaches `ingest.py publish`,
# which pushes a snapshot to a public branch. The same question is open for the
# proprietary Macrobond series already in the set.

default: macrobond

series:
  PCEC96:
    macrobond: usnaac0591
    note: Real PCE quantity index. Same growth as chained dollars, history from 1959 not 2007.
  RSAFS:
    macrobond: ustrad0068
  PAYEMS:
    macrobond: uslama1060
  UNRATE:
    macrobond: uslama1849
  NROU:
    macrobond: usfcst0668
    note: CBO noncyclical rate. Projections beyond each vintage date are dropped.
  T5YIFR:
    macrobond: ust5yifr
  T10YIE:
    macrobond: us10ybei
    note: Macrobond benchmark 10-year breakeven, not the H.15 constant-maturity difference.
  MICH:
    macrobond: ussurv3140
  EXPINF10YR:
    macrobond: usfcst0110
  TCU:
    macrobond: usprod1071
  JTSJOL:
    macrobond: bls_jts00000000jol
  UNEMPLOY:
    macrobond: uslama1795
  ULCNFB:
    macrobond: uslama0208
  LNS12300060:
    macrobond: uslama6229
  FEDFUNDS:
    macrobond: usrate1948
  PCEPILFE:
    macrobond: uspric0006
  NFCI:
    macrobond: ussurv0386
  NEWORDER:
    macrobond: usprod1425
  PNFIC1:
    macrobond: usnaac0301
    note: Real nonresidential investment quantity index. Same growth as chained dollars.
  TLMFGCONS:
    macrobond: uscons2437
  DRTSCILM:
    macrobond: ussurv4106

  # Timely indicators. Names without a FRED equivalent are internal names and
  # can only come from Macrobond.
  WEI:
    macrobond: ussurv01117
    note: Weekly Economic Index, now published by the Dallas Fed. Scaled to four-quarter GDP growth.
  IC4WSA:
    macrobond: uslama4575
    note: Initial jobless claims, 4-week moving average, SA. Weekly, released Thursdays.
  GSCPI:
    macrobond: wotrad0027
    note: NY Fed Global Supply Chain Pressure Index, standard deviations from average.
  PHILCAPEX:
    macrobond: ussurv1133
    note: Philadelphia Fed manufacturing survey, future capital expenditures, SA diffusion index.
  EMPIRECAPEX:
    macrobond: ussurv1020
    note: NY Fed Empire State manufacturing survey, future capital expenditures, SA index.
  # Fiscal. Monthly Treasury Statement flows are summed over 12 months and set
  # against nominal GDP in the indicator expressions.
  MTSBAL:
    macrobond: usgpfi0055
    note: Federal budget surplus or deficit, monthly, USD (Monthly Treasury Statement).
  MTSNETINT:
    macrobond: usgpfi0191
    note: Federal net interest outlays, monthly, USD (Monthly Treasury Statement).
  GDPNOM:
    macrobond: usnaac0057
    note: Nominal GDP, SA annual rate, USD. Quarterly, carried to monthly.
  DEBTPUB:
    macrobond: usflof_024008
    note: Treasury securities held by the public, USD (Fed Financial Accounts, Z.1). Quarterly.
  # Neutral rate for the Taylor rule and the real-rate gap.
  SEPLR:
    macrobond: usfcst2433
    note: FOMC Summary of Economic Projections, longer-run fed funds rate, median. Nominal; published quarterly since 2012.
  HLWRSTAR:
    macrobond: usfcst2428
    note: NY Fed Holston-Laubach-Williams natural rate of interest, one-sided (real-time filter). Quarterly since 1961.
  EXPINF1YR:
    macrobond: usfcst0101
    note: Cleveland Fed model-based expected inflation, 1 year.
  # Wages, productivity, the Fed's balance sheet and corporate leverage, added
  # to match the drivers on the scenario slide.
  ECIWAG:
    macrobond: uslama4604
    note: >-
      Employment cost index, wages and salaries, private industry, SA. Quarterly
      since 1980. Preferred over average hourly earnings, which jumped eight
      percent in 2020 purely because low-wage jobs disappeared from the sample.
  OPHNFB:
    macrobond: uslama0202
    note: Nonfarm business labor productivity, output per hour, index, SA. Quarterly since 1947.
  WSHOSHO:
    macrobond: usbank0144
    note: >-
      Securities held outright by the Federal Reserve, total, weekly average.
      From 1989. The portfolio QE and QT actually move, rather than total assets,
      which also swings with repo and emergency lending facilities.
  NFIBCAPEX:
    macrobond: ussurv1414
    note: >-
      NFIB Small Business Economic Trends, capital expenditure plans next three
      to six months, SA. Monthly since 1986. No FRED equivalent, so the name is
      internal.

  # Longer-horizon inputs: physical oil tightness, the cost of equity capital,
  # and the long rate behind debt dynamics.
  WCESTUS1:
    macrobond: uscaes0003
    note: >-
      EIA weekly commercial crude oil stocks, excluding the Strategic Petroleum
      Reserve. Weekly since 1982, published five days after the week ends.
      Excludes the SPR deliberately: that is a policy stock on a forty-year
      trend, not a measure of what the physical market is pricing.
  CAPE:
    macrobond: sp500_shpe
    note: >-
      Shiller cyclically adjusted price/earnings ratio for the S&P 500, monthly
      since 1881. A market price, so never revised: a single vintage is correct
      here rather than a gap in the record.
  DGS10:
    macrobond: us10yfedgov_m
    note: 10-year Treasury constant maturity yield, monthly average, since 1941.
  SPFCPI10:
    macrobond: usfcst0720
    note: >-
      Survey of Professional Forecasters, mean expected CPI inflation over the
      next ten years, quarterly since 1991. Philadelphia Fed. CPI rather than
      PCE: the PCE version only starts in 2007. No FRED equivalent, so the name
      is internal.
  INFRISKPREM:
    macrobond: usfcst0669
    note: >-
      Cleveland Fed 10-year inflation risk premium: the part of a breakeven that
      pays for bearing inflation uncertainty rather than for expected inflation.
      Monthly since 1982. Pairs with EXPINF10YR, the expectations half of the
      same decomposition.
  DGS1:
    macrobond: us12mfedgov_m
    note: >-
      1-year Treasury constant maturity yield, monthly, since 1953. Paired with
      the 10-year for the curve slope. The 1-year rather than the 3-month buys
      thirty years of extra history and inverts at much the same times.
  PERMIT:
    macrobond: uslead0109
    note: >-
      Building permits for new private housing units, SA annual rate, monthly
      since 1954. Census data, carried in the Conference Board's business cycle
      set.
  EBP:
    macrobond: uslead0489
    note: >-
      Excess bond premium, Gilchrist and Zakrajsek, published by the Federal
      Reserve. Monthly since 1973. The part of corporate bond spreads left after
      removing compensation for expected default: the price of bearing credit
      risk rather than the risk itself. Mean zero by construction.

  # Twin-only series (config/twin.yml). Nothing in the live model reads these.
  SPF10GDP:
    macrobond: usfcst0722
    note: >-
      SPF mean expected real GDP growth over the next ten years. Asked once a
      year despite the quarterly label, so the revision is annual.
  SPFDISP:
    macrobond: usfcst2854
    note: >-
      SPF cross-sectional dispersion, GDP price index four quarters ahead,
      quarterly from 1968. Near-term, not ten-year: long-run dispersion is not
      published.
  CAPAGE:
    macrobond: bea001_106e1ptotl1es00_a
    note: BEA current-cost average age of private fixed assets, equipment. Annual from 1925.
  CDS5Y_US:
    use: bloomberg
    bloomberg: "US CDS USD SR 5Y D14 Corp"
    note: >-
      US sovereign CDS, 5-year, dollar contract, from August 2018. The euro
      contract is missing 2017 and 2019-23 and is not spliced on.
  HYOAS:
    use: bloomberg
    bloomberg: "LF98OAS Index"
    note: Bloomberg US Corporate High Yield option-adjusted spread, from 1994.
  HLW_TREND_G:
    use: macrobond
    macrobond: usfcst2426
    note: >-
      New York Fed Holston-Laubach-Williams trend growth, the g inside r*,
      quarterly from 1961. One-sided estimates, so each quarter's figure uses
      only data available then; the revision is the change between consecutive
      quarters of that filtered path. Not a true vintage diff -- the model is
      re-estimated, so the whole path moves a little -- but the one-sided
      series is the standard real-time reading.
  # The two sector indices behind the retail-versus-staples read. Kept as two
  # series rather than one ratio so the ratio is formed in the indicator, where
  # it can be seen.
  SPX_RETL:
    use: bloomberg
    bloomberg: "S5RETL Index"
    note: S&P 500 retailing industry group, daily from September 1989.
  SPX_CONS:
    use: bloomberg
    bloomberg: "S5CONS Index"
    note: S&P 500 consumer staples sector, daily from September 1989.
  SPX_EPS_3FY:
    use: bloomberg
    bloomberg: "SPX Index|BEST_EPS|3FY"
    note: >-
      Consensus S&P 500 earnings for the third fiscal year out, monthly from
      1990. The period override is what fixes the horizon at three years; plain
      BEST_EPS means the current year, whose distance ahead shrinks as the year
      runs on. Scored as a revision, never as a level.
  # Built by src/twin.py from Macrobond's vintage history, not fetched: a
  # target-dated projection has to be turned into a dated revision first.
  CBO_POTGROWTH_REV:
    use: derived
    derived_from: usfcst1985
    note: >-
      Revision to CBO's five-year-ahead potential growth rate between
      consecutive projections, in points. Growth rather than level, because the
      level jumps at every BEA rebasing.
  CBO_LABFORCE_REV:
    use: derived
    derived_from: usfcst0572
    note: >-
      Revision to CBO's five-year-ahead potential labour force between
      consecutive projections, in log percent.

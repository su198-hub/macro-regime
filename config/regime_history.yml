# Notes for the /history page: what was going on, one short line per period.
#
# Keyed by a month, not by a period. A period shows every note whose month
# falls inside it, so a data revision that moves a boundary by a month or two
# does not orphan the note. Written by hand; check them against your own
# reading of the history and edit freely.
#
# The labels date each year-over-year rate by the month it ends in, so a
# period starts about six months after the events that drive it. The keys
# follow the labels: each sits about six months after the events it describes
# (the 1980 recession note is keyed July 1980).

notes:
  "1980-07": "1980 recession, with credit controls. Core PCE near 9.5%."
  "1981-05": "Short rebound between the two Volcker recessions."
  "1981-11": "Volcker's second recession. Inflation falling but still above expectations."
  "1983-06": "Recovery starts; inflation close to expectations."
  "1984-01": "Strong recovery while inflation fell below what people expected."
  "1987-01": "Growth slows to potential after the oil price collapse."
  "1987-10": "Expansion through the 1987 crash; inflation on expectations."
  "1988-12": "Late-80s boom; the Fed tightens into 1989."
  "1990-06": "Slowdown, Gulf War oil shock and the 1990–91 recession."
  "1992-05": "Brief rebound after the recession."
  "1992-09": "Jobless recovery, then expansion through the Fed's 1994 hikes."
  "1995-05": "Mid-cycle slowdown after the 1994 hikes; no recession."
  "1996-05": "Late-90s productivity boom."
  "2000-09": "Dot-com bust, 2001 recession and jobless recovery."
  "2003-08": "Housing-led expansion; inflation on expectations."
  "2007-02": "Housing turns, then the global financial crisis."
  "2010-03": "Recovery from a deep trough; low inflation."
  "2011-08": "Soft patch: oil spike and the Japan earthquake."
  "2012-01": "Slow, steady expansion; inflation below expectations."
  "2016-05": "Oil and industrial slump, strong dollar; no recession."
  "2017-09": "Synchronized global upturn and the 2017 tax cut."
  "2020-02": "Trade-war slowdown, then the Covid shutdown."
  "2021-04": "Reopening boom and stimulus."
  "2022-09": "Inflation peak; the Fed hikes fast and growth slows."
  "2023-08": "Growth above potential while core PCE stayed about 1 point above expectations. Often called a soft landing."

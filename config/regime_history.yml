# Notes for the /history page: what was going on, one short line per period.
#
# Keyed by a month, not by a period. A period shows every note whose month
# falls inside it, so a data revision that moves a boundary by a month or two
# does not orphan the note. Written by hand; check them against your own
# reading of the history and edit freely.

notes:
  "1980-01": "1980 recession, with credit controls. Core PCE near 9.5%."
  "1980-11": "Short rebound between the two Volcker recessions."
  "1981-05": "Volcker's second recession. Inflation falling but still above expectations."
  "1982-12": "Recovery starts; inflation close to expectations."
  "1983-07": "Strong recovery while inflation fell below what people expected."
  "1986-07": "Growth slows to potential after the oil price collapse."
  "1987-04": "Expansion through the 1987 crash; inflation on expectations."
  "1988-06": "Late-80s boom; the Fed tightens into 1989."
  "1989-12": "Slowdown, Gulf War oil shock and the 1990–91 recession."
  "1991-11": "Brief rebound after the recession."
  "1992-03": "Jobless recovery, then expansion through the Fed's 1994 hikes."
  "1994-11": "Mid-cycle slowdown after the 1994 hikes; no recession."
  "1995-11": "Late-90s productivity boom."
  "2000-03": "Dot-com bust, 2001 recession and jobless recovery."
  "2003-02": "Housing-led expansion; inflation on expectations."
  "2006-08": "Housing turns, then the global financial crisis."
  "2009-09": "Recovery from a deep trough; low inflation."
  "2011-02": "Soft patch: oil spike and the Japan earthquake."
  "2011-07": "Slow, steady expansion; inflation below expectations."
  "2015-11": "Oil and industrial slump, strong dollar; no recession."
  "2017-03": "Synchronized global upturn and the 2017 tax cut."
  "2019-08": "Trade-war slowdown, then the Covid shutdown."
  "2020-10": "Reopening boom and stimulus."
  "2022-03": "Inflation peak; the Fed hikes fast and growth slows."
  "2023-02": "Growth above potential while core PCE stayed about 1 point above expectations. Often called a soft landing."
  "2026-02": "Provisional: growth slips just below potential; inflation still above expectations."

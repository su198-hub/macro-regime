# US indicator set, v0.2
#
# Every indicator belongs to exactly one driver and carries an explicit weight
# and a reason. If you can't write the reason, the indicator doesn't belong.
#
# normalize methods:
#   zscore  - rolling z-score over `window` months. Use when "unusual" is the
#             thing you care about and there is no economically meaningful level.
#   gap     - (value - center) / scale, clipped by the engine. Use whenever a
#             level has meaning: 2% target, long-run average utilization, r*.
#             Prefer this. A z-score tells you rare; a gap tells you tight.
#
# direction: +1 if a high value means the driver is "hot", -1 if inverted.
#
# anchor: true marks hard data a month cannot be confirmed without. Until an
# anchor has reported, the month can only be read provisionally. `release`
# names the publication users wait for, shown on the dashboard.
#
# carry_forward_periods on an indicator overrides the meta default for its
# inputs, for estimates that are revised rarely.
#
# signpost: display only, for the signpost chart. `low` and `high` name the
# ends of the -1 and +1 scale; tone is risk or good. `reverse: true` draws +1
# on the left without touching the score itself.
#
# v0.2 added timely indicators at small weights, so the latest month can be read
# before the slow releases. v0.3 balances that with longer-horizon inputs — oil
# inventories against their own five-year average, the equity risk premium, r
# minus g — because a regime lasts years and a monitor built only of fast data
# reports what just happened. meta.horizons says which is which, and a long
# input enters as a change, a spread or a deviation from trend unless it is
# marked absolute_level, for the few whose level is the point.

meta:
  region: US
  base_frequency: M
  history_start: "1970-01-01"
  # Quarterly and annual inputs hold their last value until the next release,
  # for at most this many of their own periods (2 = six months for quarterly,
  # two years for annual). Beyond that the input counts as missing, so a
  # discontinued series drops out rather than freezing a driver.
  carry_forward_periods: 2
  # Ragged edge. A driver is confirmed in a month only if at least this share
  # of the weight of its already-started indicators has reported, and every
  # started anchor has reported.
  min_reported_share: 0.6
  # Provisional reading for months not yet confirmed. Indicators not yet
  # released for the month carry their latest score for at most `fill_months`,
  # and a month is shown only once at least `min_reported_share` of the weight
  # across all drivers has reported for it.
  provisional:
    fill_months: 2
    min_reported_share: 0.5

  # How far ahead each indicator is really looking. The monitor is a monthly
  # nowcast, but a regime is not a month, so every driver carries something
  # slower than the news:
  #
  #   short   turns within weeks to a quarter. Fast, noisy, and what makes the
  #           provisional reading possible at all.
  #   medium  a business-cycle horizon, one to three years.
  #   long    structural or a market's multi-year view. A price like the 5y5y
  #           breakeven or the equity risk premium is long-horizon in content
  #           while trading daily, which is the combination worth having.
  #
  # Long and medium inputs enter as a change, a spread, or a deviation from
  # their own trend, because a raw level against a fixed center scores which
  # decade it is rather than what is happening. The exception is marked
  # `absolute_level: true` on the indicator: an inflation expectation against
  # the 2% target is meant to be read as a level, since the target is a policy
  # commitment rather than an average that drifts.
  horizons:
    short: [jobless_claims_yoy, umich_1y, supply_chain_pressure,
            financial_conditions]
    medium: [real_pce_yoy, unemployment_gap, wage_growth_yoy, capacity_utilisation,
             vacancies_per_unemployed, unit_labour_costs_yoy, oil_inventory_tightness,
             taylor_gap, taylor_gap_expected, real_fed_funds, balance_sheet_impulse,
             primary_balance_gdp, fiscal_impulse, debt_trajectory,
             core_capex_orders_yoy, real_nonres_investment_yoy,
             building_permits_yoy, excess_bond_premium, ci_lending_standards]
    long: [breakeven_5y5y, spf_long_run, spf_cpi_revision, spf_growth_revision,
           inflation_risk_premium, cleveland_10y, productivity_yoy,
           interest_burden_gdp, debt_sustainability_gap, equity_risk_premium,
           yield_curve_slope]

drivers:

  demand:
    label: Demand
    description: Strength of final demand relative to trend.
    # `phrase` is how the driver reads in a sentence on the dashboard, when it
    # explains why a month was called what it was. Write it as a fragment that
    # follows "because ...": lower case, no verb of its own.
    signpost:
      low: {label: Weak, tone: risk, phrase: demand is running below trend}
      high: {label: Strong, tone: good, phrase: demand is running above trend}
      mid: {phrase: demand is close to trend}
    indicators:
      - id: real_pce_yoy
        label: Real consumer spending, year over year
        source: {fred: PCEC96}
        transform: yoy_pct
        normalize: {method: gap, center: 2.4, scale: 1.6}
        direction: 1
        weight: 0.30
        anchor: true
        release: PCE report
        why: Consumption is two thirds of GDP and revises less than GDP itself.

      # Wage growth is the labor-market read the scenario slide asks for that
      # payrolls and the unemployment gap do not give: how much income the
      # labor market is actually generating. ECI rather than average hourly
      # earnings, which rose eight percent in 2020 because low-wage jobs left
      # the sample, and would have scored the collapse as a hot labor market.
      - id: wage_growth_yoy
        label: Employment cost index, wages, year over year
        source: {fred: ECIWAG}
        transform: yoy_pct
        normalize: {method: gap, center: 2.9, scale: 0.75}
        direction: 1
        weight: 0.15
        carry_forward_periods: 2
        release: Employment cost index
        why: >-
          Wage growth controlled for job mix. Centered on the 1990-2019 average
          rather than 2% plus trend productivity, which would mark almost the
          whole sample as cool because the labor share fell through it.

      # Payroll growth was here and is out. A household reads a payroll bump it
      # believes is temporary as almost nothing, because spending follows
      # expected lifetime resources rather than this month's income, and the
      # driver already has three readings of what has just happened.
      #
      # This is the same question asked forward: not what the economy is
      # earning now but what forecasters think it can sustain over a decade,
      # and specifically the CHANGE in that view. The level sits near 2% for
      # years and cannot tell one month from another; the revision is the
      # economy being re-rated, and it is the one measure in this driver whose
      # correlation with growth still to come survives testing -- +0.36 against
      # the next year, 95% [+0.05, +0.62], where every other candidate tried
      # spans zero.
      - id: spf_growth_revision
        label: Revision to forecasters' 10-year GDP growth
        source: {fred: SPF10GDP}
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 0.19}
        direction: 1
        weight: 0.30
        carry_forward_periods: 2
        release: Survey of Professional Forecasters
        why: >-
          Expected lifetime income, re-rated: the change in what forecasters
          think the economy can grow at over a decade. Asked once a year, so it
          is an annual signal carried through the year, which is the honest
          cost of reading this far ahead.

      - id: unemployment_gap
        label: Unemployment rate less its long-run level
        source:
          expr: "UNRATE - NROU"
          fred: [UNRATE, NROU]
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.8}
        direction: -1
        weight: 0.15
        # CBO revises its noncyclical rate once or twice a year and it moves
        # slowly, so hold it for up to six quarters rather than two.
        carry_forward_periods: 6
        why: >-
          Slack relative to CBO's estimate of the noncyclical rate. Cut from a
          quarter of the driver to 0.15: unemployment turns after the spending
          that causes it, and the benchmark it is measured against is CBO's
          noncyclical rate, which is itself revised backwards. The released
          weight went to the ten-year growth revision above, the same question
          asked forward instead of backward.

      # The weekly economic index was dropped here: it is a composite whose
      # components are mostly jobless claims and retail sales, so next to the
      # claims series below it was the same week's news counted twice, and it
      # was the shortest-horizon input in the model.
      - id: jobless_claims_yoy
        label: Initial jobless claims, year over year
        source: {fred: IC4WSA}
        transform: yoy_pct
        normalize: {method: gap, center: 0.0, scale: 20.0}
        direction: -1
        weight: 0.10
        why: Weekly and early at turning points. Rising claims mean weakening demand.

  inflation_expectations:
    label: Inflation expectations
    description: Where expectations sit relative to the 2% target.
    signpost:
      low: {label: De-anchored lower, tone: risk, phrase: inflation expectations sit below target}
      high: {label: De-anchored higher, tone: risk, phrase: inflation expectations sit above target}
      mid: {phrase: inflation expectations are anchored}
    indicators:
      - id: breakeven_5y5y
        label: 5-year inflation expectations, 5 years ahead
        source: {fred: T5YIFR}
        transform: level
        normalize: {method: gap, center: 2.3, scale: 0.35}
        direction: 1
        absolute_level: true   # an expectation measured against the 2% target
        weight: 0.30
        why: >-
          Market-implied inflation for the five years starting five years out,
          far enough ahead that today's oil price and business cycle have washed
          out and only the anchor is left. Daily, never revised.

      # Professionals rather than households. Forecasters barely move this
      # number, which is what makes it informative: when a long-run survey
      # shifts, something has changed about the anchor itself. Centered on 2.3
      # rather than 2.0 because it forecasts CPI, which runs about three tenths
      # above the PCE measure the Fed targets.
      - id: spf_long_run
        label: Professional forecasters, CPI over the next ten years
        source: {fred: SPFCPI10}
        transform: level
        normalize: {method: gap, center: 2.3, scale: 0.35}
        direction: 1
        absolute_level: true   # an expectation measured against the 2% target
        weight: 0.10
        carry_forward_periods: 2
        release: Survey of Professional Forecasters
        why: >-
          The survey-against-target reading, from the forecasters the Fed itself
          watches. A level, because what makes an anchor an anchor is where it
          sits relative to 2%, not whether it moved this quarter. Half the
          weight of this question; the revision below carries the other half.

      # The same survey read as a change. Not the level counted twice: the two
      # correlate -0.14 and disagree in sign in 51% of quarters, which is the
      # difference between an anchor above target and falling and one stuck
      # above target. Neither works alone -- a level cannot separate those two,
      # and a revision reads zero when expectations are simply wrong and
      # stable. Scored over four quarters rather than one: a single quarter
      # moves more than 0.1 points only a quarter of the time, a year's
      # accumulated revision about half.
      - id: spf_cpi_revision
        label: Revision to forecasters' 10-year CPI
        source: {fred: SPFCPI10}
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 0.14}
        direction: 1
        weight: 0.10
        carry_forward_periods: 2
        release: Survey of Professional Forecasters
        why: >-
          The anchor moving rather than where it sits. It ran +0.48 through 2022
          as forecasters marked the decade up and -0.63 through 2023 as they
          took it back, neither of which shows in a level that has never left a
          half-point band.

      # A breakeven is expected inflation plus payment for bearing inflation
      # risk. Without the second term you cannot tell a rise in expectations
      # from a rise in uncertainty, and they mean different things.
      - id: inflation_risk_premium
        label: Inflation risk premium, 10 year
        source: {fred: INFRISKPREM}
        transform: level
        normalize: {method: gap, center: 0.41, scale: 0.07}
        direction: 1
        absolute_level: true   # a premium that mean-reverts around zero-ish, not a trending level
        weight: 0.10
        why: >-
          What markets pay to be insured against inflation, apart from what they
          expect it to be. It widens when the distribution of outcomes skews
          upward, which is de-anchoring risk before expectations themselves move.

      - id: umich_1y
        label: Household inflation expectations, 1 year
        source: {fred: MICH}
        transform: level
        normalize: {method: gap, center: 3.0, scale: 1.2}
        direction: 1
        weight: 0.15
        why: >-
          Household expectations, centered on 3 rather than 2 because households
          persistently report above realized inflation. Held at a lower weight
          than the professional survey: since 2021 the answers have diverged by
          political affiliation more than by inflation.

      - id: cleveland_10y
        label: Cleveland Fed 10-year expected inflation
        source: {fred: EXPINF10YR}
        transform: level
        normalize: {method: gap, center: 2.0, scale: 0.4}
        direction: 1
        absolute_level: true   # an expectation measured against the 2% target
        weight: 0.25
        why: >-
          Model-based expected inflation, with the risk and liquidity premia
          taken out. The expectations half of the decomposition whose other half
          is the risk premium below.

  supply:
    label: Supply constraint
    description: How binding are capacity, labor and input constraints.
    signpost:
      low: {label: Over-capacity, tone: risk, phrase: there is spare capacity to grow into}
      high: {label: Under-capacity, tone: risk, phrase: capacity and labor are binding}
      mid: {phrase: capacity is near normal}
    indicators:
      - id: capacity_utilisation
        label: Capacity utilization
        source: {fred: TCU}
        transform: level
        normalize: {method: gap, center: 79.6, scale: 2.5}
        direction: 1
        weight: 0.20
        why: Long-run average utilization is the natural center here.

      - id: vacancies_per_unemployed
        label: Job openings per unemployed person
        source:
          expr: "JTSJOL / UNEMPLOY"
          fred: [JTSJOL, UNEMPLOY]
        transform: level
        normalize: {method: gap, center: 0.95, scale: 0.35}
        direction: 1
        weight: 0.20
        why: Cleanest single measure of labor market tightness.

      - id: unit_labour_costs_yoy
        label: Unit labor costs, year over year
        source: {fred: ULCNFB}
        transform: yoy_pct
        normalize: {method: gap, center: 2.2, scale: 1.5}
        direction: 1
        weight: 0.15
        why: Where wage pressure turns into price pressure.

      # Energy is the supply shock that has actually caused stagflation, and
      # inventories are how the physical market says whether it is tight. A
      # level means nothing here — storage grows with the economy — so it is
      # measured against its own five-year average, which is the convention the
      # EIA publishes and which cycles over two to four years rather than
      # trending. Weekly, so it is also the fastest input in this driver.
      - id: oil_inventory_tightness
        label: Crude oil inventories against their five-year average
        source: {fred: WCESTUS1}
        transform: dev_5y_pct
        normalize: {method: gap, center: 3.0, scale: 10.0}
        direction: -1
        weight: 0.20
        why: >-
          Full tanks mean the constraint is slack, empty ones mean it binds, so
          it enters inverted. Commercial stocks only: the Strategic Petroleum
          Reserve is a policy stock on a forty-year trend, not what the market
          prices against.

      # Productivity is the supply side's other half: the same demand meets a
      # binding constraint or an expanding one depending on output per hour.
      # It replaces prime-age employment, which was inverted on the theory that
      # a low employment rate means labor has left the pool, and so read the
      # demand-driven slack of 2009 to 2013 as a supply constraint.
      - id: productivity_yoy
        label: Labor productivity, year over year
        source: {fred: OPHNFB}
        transform: yoy_pct
        normalize: {method: gap, center: 2.0, scale: 1.5}
        direction: -1
        weight: 0.10
        carry_forward_periods: 2
        release: Productivity and costs
        why: >-
          Faster productivity growth relieves the constraint, so it enters
          inverted. Paired with unit labor costs, which is this net of wages.

      - id: supply_chain_pressure
        label: Global supply chain pressure
        source: {fred: GSCPI}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.0}
        direction: 1
        weight: 0.15
        why: Input bottlenecks from shipping, delivery times and backlogs, out days after month end.

  # Policy is split in two, as on the scenario slide. Monetary and fiscal
  # stance often move in opposite directions and regimes differ on each, so a
  # single combined score would let them cancel out.
  # Monetary policy reads "too hawkish / too dovish" against what conditions
  # call for, so its core is a Taylor-rule gap: the fed funds rate less the
  # rate the rule recommends.
  #
  #   Taylor rate = r* + inflation + 0.5 x (inflation - 2) + 0.5 x output gap
  #
  # r* (real neutral rate) is the FOMC's longer-run fed funds median less the
  # 2% target where published (2012 on), otherwise the NY Fed's one-sided
  # Holston-Laubach-Williams estimate. The output gap is 2 x (CBO noncyclical
  # unemployment rate - unemployment rate), an Okun's-law proxy that updates
  # monthly. The recommended rate is floored at 0.125%, the middle of the zero
  # lower-bound range, so years at zero do not read as too hawkish.
  # Coefficients (0.5, 0.5, 2) and the floor are Taylor (1993) choices to argue with.
  monetary:
    label: Monetary policy
    description: How restrictive policy is against what inflation and slack call for, plus financial conditions.
    signpost:
      low: {label: Too dovish, tone: risk, phrase: policy is looser than the rule calls for}
      high: {label: Too hawkish, tone: risk, phrase: policy is tighter than the rule calls for}
      mid: {phrase: policy is close to what the rule calls for}
      reverse: true
    indicators:
      - id: taylor_gap
        label: Fed funds rate less Taylor rule rate
        source:
          expr: "FEDFUNDS - taylor_rate"
          fred: [FEDFUNDS, PCEPILFE, UNRATE, NROU, SEPLR, HLWRSTAR]
          derived: &taylor_inputs
            core_pce_yoy: {fred: PCEPILFE, transform: yoy_pct}
            neutral_sep: {expr: "SEPLR - 2"}
            neutral_rate: {first_of: [neutral_sep, HLWRSTAR]}
            output_gap: {expr: "2 * (NROU - UNRATE)"}
            taylor_rate:
              expr: "neutral_rate + core_pce_yoy + 0.5 * (core_pce_yoy - 2) + 0.5 * output_gap"
              floor: 0.125
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.5}
        direction: 1
        weight: 0.25
        anchor: true
        release: PCE report
        carry_forward_periods: 6
        why: Policy against what inflation and slack call for. Below zero, the Fed is behind the curve.

      - id: taylor_gap_expected
        label: Fed funds rate less Taylor rule rate, using expected inflation
        source:
          expr: "FEDFUNDS - taylor_rate_expected"
          fred: [FEDFUNDS, EXPINF1YR, UNRATE, NROU, SEPLR, HLWRSTAR]
          derived:
            neutral_sep: {expr: "SEPLR - 2"}
            neutral_rate: {first_of: [neutral_sep, HLWRSTAR]}
            output_gap: {expr: "2 * (NROU - UNRATE)"}
            taylor_rate_expected:
              expr: "neutral_rate + EXPINF1YR + 0.5 * (EXPINF1YR - 2) + 0.5 * output_gap"
              floor: 0.125
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.5}
        direction: 1
        weight: 0.15
        carry_forward_periods: 6
        why: Forward-looking version of the rule, available weeks before core PCE.

      - id: real_fed_funds
        label: Real fed funds rate less neutral rate
        source:
          expr: "FEDFUNDS - core_pce_yoy - neutral_rate"
          fred: [FEDFUNDS, PCEPILFE, UNRATE, NROU, SEPLR, HLWRSTAR]
          derived: *taylor_inputs
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.5}
        direction: 1
        weight: 0.10
        carry_forward_periods: 6
        release: PCE report
        why: Plain stance check with no rule coefficients. Guards against the Taylor rule's uncertain inputs.

      - id: financial_conditions
        label: Financial conditions index
        source: {fred: NFCI}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.5}
        direction: 1
        weight: 0.20
        why: Captures credit spreads and leverage the funds rate misses.

      # The rule-based indicators above judge the stance against what today's
      # inflation and slack call for. The curve is the other question: what the
      # market thinks that stance will do. An inverted curve says short rates
      # are expected to fall, which is the bond market's verdict that policy is
      # tight enough to break something. Inverted before every postwar
      # recession, with two false positives, 1966 and the 28-month inversion of
      # 2022 to 2024 — so it is carried at a weight that informs rather than
      # decides.
      - id: yield_curve_slope
        label: Yield curve, 10-year less 1-year
        source:
          expr: "DGS10 - DGS1"
          fred: [DGS10, DGS1]
        transform: level
        normalize: {method: gap, center: 1.47, scale: 1.05}
        direction: -1
        weight: 0.15
        why: >-
          A flat or inverted curve is restrictive, so it enters inverted. A
          spread, so it cannot drift the way a level of rates does.

      # The rate is not the whole stance. From 2009 to 2014 and again in 2020
      # the funds rate sat at its floor while the balance sheet did the work, so
      # a rate-only driver reads those years as merely loose rather than as
      # loose as they were. Measured as the change over a year in the portfolio
      # QE and QT actually move, against GDP, so it is a flow like the fiscal
      # impulse: buying is easing, running off is tightening.
      - id: balance_sheet_impulse
        label: Fed securities held, change over a year, % of GDP
        source:
          expr: "WSHOSHO / GDPNOM * 100"
          fred: [WSHOSHO, GDPNOM]
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 2.0}
        direction: -1
        weight: 0.15
        why: >-
          Quantitative easing and tightening, the part of the stance the Taylor
          gap cannot see. Inverted: a growing portfolio is easier policy.

  # Fiscal: +1 is small or consolidating fiscal (tight), -1 large or expanding
  # fiscal, consistent with +1 = restrictive for every driver. Flows come from
  # the Monthly Treasury Statement summed over 12 months, so the driver updates
  # monthly. Centers and scales are 1990-2019 averages and standard deviations.
  # Federal only: state and local budgets are not included.
  fiscal:
    label: Fiscal policy
    description: Size and direction of federal fiscal support, and the room left for it.
    signpost:
      low: {label: Large fiscal, tone: good, phrase: fiscal policy is adding to demand}
      high: {label: Small fiscal, tone: risk, phrase: fiscal policy is pulling back}
      mid: {phrase: fiscal policy is roughly neutral}
      reverse: true
    indicators:
      - id: primary_balance_gdp
        label: Primary balance, % of GDP
        source:
          expr: "(balance_12m + interest_12m) / GDPNOM * 100"
          fred: [MTSBAL, MTSNETINT, GDPNOM]
          derived:
            balance_12m: {fred: MTSBAL, transform: sum_12m}
            interest_12m: {fred: MTSNETINT, transform: sum_12m}
        transform: level
        normalize: {method: gap, center: -1.0, scale: 3.0}
        direction: 1
        weight: 0.35
        release: Monthly Treasury Statement
        why: The budget balance before interest. The government's own stance, stripped of past debt costs.

      - id: fiscal_impulse
        label: Fiscal impulse, change in primary balance over a year
        source:
          expr: "(balance_12m + interest_12m) / GDPNOM * 100"
          fred: [MTSBAL, MTSNETINT, GDPNOM]
          derived:
            balance_12m: {fred: MTSBAL, transform: sum_12m}
            interest_12m: {fred: MTSNETINT, transform: sum_12m}
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 1.7}
        direction: 1
        weight: 0.25
        release: Monthly Treasury Statement
        why: Direction matters as much as level. A shrinking deficit withdraws demand even if it is still large.

      - id: debt_trajectory
        label: Debt held by the public, change in % of GDP over a year
        source:
          expr: "DEBTPUB / GDPNOM * 100"
          fred: [DEBTPUB, GDPNOM]
        transform: diff_12m
        normalize: {method: gap, center: 1.3, scale: 3.4}
        direction: -1
        weight: 0.10
        why: Debt rising faster than usual means fiscal is adding to demand. Inverted.

      # Whether the debt stabilises on its own comes down to one difference: the
      # rate paid on the debt against the growth of the economy carrying it.
      # Above zero the stock compounds and the room for support narrows whatever
      # this year's deficit is; below zero it erodes quietly. A spread, so it
      # cycles rather than drifting the way a level of debt does.
      - id: debt_sustainability_gap
        label: 10-year yield less nominal GDP growth
        source:
          expr: "DGS10 - gdp_growth"
          fred: [DGS10, GDPNOM]
          derived:
            # Trend growth, not this year's: a year-on-year rate would carry
            # whichever recession sits in the window and read 2020 as the
            # moment fiscal room vanished, which is backwards.
            gdp_growth: {fred: GDPNOM, transform: pct_change_5y_ann}
        transform: level
        normalize: {method: gap, center: -0.25, scale: 1.2}
        direction: 1
        weight: 0.15
        carry_forward_periods: 2
        why: >-
          r minus g, the term that decides whether debt compounds. Positive
          narrows the room for fiscal support, so it pushes toward the small
          fiscal end even when the deficit is wide.

      - id: interest_burden_gdp
        label: Net interest outlays, % of GDP
        source:
          expr: "interest_12m / GDPNOM * 100"
          fred: [MTSNETINT, GDPNOM]
          derived:
            interest_12m: {fred: MTSNETINT, transform: sum_12m}
        transform: level
        normalize: {method: gap, center: 2.0, scale: 0.7}
        direction: 1
        absolute_level: true   # the level is the constraint: a rising interest bill really does narrow the room, so the drift is the signal
        weight: 0.15
        release: Monthly Treasury Statement
        why: Debt sustainability. A heavy interest bill narrows the room for fiscal support.

  investment:
    label: Investment spending
    description: Capex momentum and the credit conditions behind it.
    signpost:
      low: {label: Low investment, tone: risk, phrase: capex is contracting}
      high: {label: High investment, tone: good, phrase: capex is expanding}
      mid: {phrase: capex is flat}
    indicators:
      - id: core_capex_orders_yoy
        label: Core capital goods orders, year over year
        source: {fred: NEWORDER}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.25
        why: Leading edge of business investment, monthly.

      - id: real_nonres_investment_yoy
        label: Real business investment, year over year
        source: {fred: PNFIC1}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.20
        why: The actual spend. Quarterly and heavily revised, hence vintages.

      # Housing is the most cyclical sector in the economy and the longest
      # leading one, turning four to six quarters before business capex, and
      # the model had no residential exposure at all. Permits rather than
      # starts: the decision to build, before ground is broken.
      - id: building_permits_yoy
        label: Building permits, year over year
        source: {fred: PERMIT}
        transform: yoy_pct
        normalize: {method: gap, center: 1.65, scale: 17.0}
        direction: 1
        weight: 0.15
        why: >-
          The earliest read on residential investment, monthly since 1954.
          Replaces manufacturing construction, which saw only the reshoring and
          chip-fab building and missed the housing cycle entirely.

      # The price of credit risk, stripped of the compensation for expected
      # default: what lenders charge for bearing it. Rises when credit is being
      # rationed for reasons unconnected to the borrower, which is what stops
      # investment. Mean zero by construction, so the center needs no judgment.
      - id: excess_bond_premium
        label: Excess bond premium
        source: {fred: EBP}
        transform: level
        normalize: {method: gap, center: 0.08, scale: 0.63}
        direction: -1
        weight: 0.15
        why: >-
          Gilchrist and Zakrajsek's residual after modelling each bond's default
          risk. Inverted: a wide premium means credit is dear and capex is next
          to stop. Forecasts investment better than a raw spread does.

      - id: ci_lending_standards
        label: Banks tightening business lending standards, net %
        source: {fred: DRTSCILM}
        transform: level
        normalize: {method: gap, center: 5.0, scale: 20.0}
        direction: -1
        weight: 0.10
        why: >-
          Net tightening chokes capex with roughly two quarters of lag. Held at
          a lower weight now that the excess bond premium prices the same
          credit conditions from the market side rather than the survey side.

      # The NFIB capex-plans survey was dropped here. It was the shortest
      # horizon input in the driver, covered small business only, and the
      # financing measures now in its place — the cost of equity, the price of
      # credit risk, the availability of bank credit — say more about whether
      # the next round of investment happens than an intentions survey does.

      # Everything else in this driver measures investment that has already
      # happened or been ordered. This is what it costs to fund the next round:
      # the earnings yield on equity over a ten-year real rate, which is the
      # hurdle capital has to clear. Cheap equity finance supports capex, so a
      # thin premium reads as supportive; the counter-argument, that a thin
      # premium is froth that ends badly, is about what happens next rather
      # than about conditions now, which is what this driver measures.
      - id: equity_risk_premium
        label: Equity risk premium over the real 10-year yield
        source:
          expr: "100 / CAPE - (DGS10 - EXPINF10YR)"
          fred: [CAPE, DGS10, EXPINF10YR]
        transform: level
        normalize: {method: gap, center: 2.1, scale: 1.4}
        direction: -1
        weight: 0.15
        why: >-
          The cost of equity capital, from the cyclically adjusted earnings
          yield less a long real rate. Inverted: a low premium is cheap funding
          for the firms doing the investing.

      # Corporate leverage was tried here and taken out again. Debt as a share
      # of GDP is a forty-year trend, not a cycle: it scored the 1990s a point
      # high and every year since 2016 a point low, which is an era bias rather
      # than a signal. Measured as a change it cycles, but the sign is
      # ambiguous, since leverage also rises when firms are investing hard. The
      # slide's capital-allocation row needs ROIC or ICOR, which is not a
      # monthly series.

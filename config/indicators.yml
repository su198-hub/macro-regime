# US indicator set, v0.2
#
# Every indicator belongs to exactly one driver and carries an explicit weight
# and a reason. If you can't write the reason, the indicator doesn't belong.
#
# normalize methods:
#   zscore  - rolling z-score over `window` months. Use when "unusual" is the
#             thing you care about and there is no economically meaningful level.
#   gap     - (value - center) / scale, clipped by the engine. Use whenever a
#             level has meaning: 2% target, long-run average utilization, r*.
#             Prefer this. A z-score tells you rare; a gap tells you tight.
#
# direction: +1 if a high value means the driver is "hot", -1 if inverted.
#
# anchor: true marks hard data a month cannot be confirmed without. Until an
# anchor has reported, the month can only be read provisionally. `release`
# names the publication users wait for, shown on the dashboard.
#
# carry_forward_periods on an indicator overrides the meta default for its
# inputs, for estimates that are revised rarely.
#
# signpost: display only, for the signpost chart. `low` and `high` name the
# ends of the -1 and +1 scale; tone is risk or good. `reverse: true` draws +1
# on the left without touching the score itself.
#
# v0.2 added timely indicators (weekly economic index, jobless claims, supply
# chain pressure, regional capex plans, an ex-ante real rate) at small weights,
# so the latest month can be read before the slow releases. Centers and scales
# for these are their 2000-2019 averages and standard deviations.

meta:
  region: US
  base_frequency: M
  history_start: "1970-01-01"
  # Quarterly and annual inputs hold their last value until the next release,
  # for at most this many of their own periods (2 = six months for quarterly,
  # two years for annual). Beyond that the input counts as missing, so a
  # discontinued series drops out rather than freezing a driver.
  carry_forward_periods: 2
  # Ragged edge. A driver is confirmed in a month only if at least this share
  # of the weight of its already-started indicators has reported, and every
  # started anchor has reported.
  min_reported_share: 0.6
  # Provisional reading for months not yet confirmed. Indicators not yet
  # released for the month carry their latest score for at most `fill_months`,
  # and a month is shown only once at least `min_reported_share` of the weight
  # across all drivers has reported for it.
  provisional:
    fill_months: 2
    min_reported_share: 0.5

drivers:

  demand:
    label: Demand
    description: Strength of final demand relative to trend.
    signpost:
      low: {label: Weak, tone: risk}
      high: {label: Strong, tone: good}
    indicators:
      - id: real_pce_yoy
        label: Real consumer spending, year over year
        source: {fred: PCEC96}
        transform: yoy_pct
        normalize: {method: gap, center: 2.4, scale: 1.6}
        direction: 1
        weight: 0.25
        anchor: true
        release: PCE report
        why: Consumption is two thirds of GDP and revises less than GDP itself.

      - id: retail_control_yoy
        label: Retail sales, year over year
        source: {fred: RSAFS}
        transform: yoy_pct
        normalize: {method: gap, center: 4.0, scale: 2.5}
        direction: 1
        weight: 0.10
        why: Timeliest hard read on goods demand, two weeks after month end.

      - id: payrolls_3m_ann
        label: Payroll growth, 3 months annualized
        source: {fred: PAYEMS}
        transform: pct_change_3m_ann
        normalize: {method: gap, center: 1.0, scale: 1.0}
        direction: 1
        weight: 0.20
        why: Labor demand, monthly, with a long and clean vintage record.

      - id: unemployment_gap
        label: Unemployment rate less its long-run level
        source:
          expr: "UNRATE - NROU"
          fred: [UNRATE, NROU]
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.8}
        direction: -1
        weight: 0.25
        # CBO revises its noncyclical rate once or twice a year and it moves
        # slowly, so hold it for up to six quarters rather than two.
        carry_forward_periods: 6
        why: Slack relative to CBO's estimate of the noncyclical rate.

      - id: weekly_economic_index
        label: Weekly economic index
        source: {fred: WEI}
        transform: level
        normalize: {method: gap, center: 2.0, scale: 1.5}
        direction: 1
        weight: 0.10
        why: Weekly activity scaled to GDP growth. First read on the month, days after it ends.

      - id: jobless_claims_yoy
        label: Initial jobless claims, year over year
        source: {fred: IC4WSA}
        transform: yoy_pct
        normalize: {method: gap, center: 0.0, scale: 20.0}
        direction: -1
        weight: 0.10
        why: Weekly and early at turning points. Rising claims mean weakening demand.

  inflation_expectations:
    label: Inflation expectations
    description: Where expectations sit relative to the 2% target.
    signpost:
      low: {label: De-anchored lower, tone: risk}
      high: {label: De-anchored higher, tone: risk}
    indicators:
      - id: breakeven_5y5y
        label: 5-year inflation expectations, 5 years ahead
        source: {fred: T5YIFR}
        transform: level
        normalize: {method: gap, center: 2.3, scale: 0.35}
        direction: 1
        weight: 0.30
        why: Market-implied long-run expectations. Daily, never revised.

      - id: breakeven_10y
        label: 10-year breakeven inflation
        source: {fred: T10YIE}
        transform: level
        normalize: {method: gap, center: 2.3, scale: 0.35}
        direction: 1
        weight: 0.15
        why: Cross-check on 5y5y, more sensitive to near-term prints.

      - id: umich_1y
        label: Household inflation expectations, 1 year
        source: {fred: MICH}
        transform: level
        normalize: {method: gap, center: 3.0, scale: 1.2}
        direction: 1
        weight: 0.25
        why: Household expectations. Noisy, but it is what the Fed watches.

      - id: cleveland_10y
        label: Cleveland Fed 10-year expected inflation
        source: {fred: EXPINF10YR}
        transform: level
        normalize: {method: gap, center: 2.0, scale: 0.4}
        direction: 1
        weight: 0.30
        why: Model-based, blends surveys and markets, no liquidity premium.

  supply:
    label: Supply constraint
    description: How binding are capacity, labor and input constraints.
    signpost:
      low: {label: Over-capacity, tone: risk}
      high: {label: Under-capacity, tone: risk}
    indicators:
      - id: capacity_utilisation
        label: Capacity utilization
        source: {fred: TCU}
        transform: level
        normalize: {method: gap, center: 79.6, scale: 2.5}
        direction: 1
        weight: 0.25
        why: Long-run average utilization is the natural center here.

      - id: vacancies_per_unemployed
        label: Job openings per unemployed person
        source:
          expr: "JTSJOL / UNEMPLOY"
          fred: [JTSJOL, UNEMPLOY]
        transform: level
        normalize: {method: gap, center: 0.95, scale: 0.35}
        direction: 1
        weight: 0.25
        why: Cleanest single measure of labor market tightness.

      - id: unit_labour_costs_yoy
        label: Unit labor costs, year over year
        source: {fred: ULCNFB}
        transform: yoy_pct
        normalize: {method: gap, center: 2.2, scale: 1.5}
        direction: 1
        weight: 0.20
        why: Where wage pressure turns into price pressure.

      - id: prime_age_epop
        label: Prime-age employment rate
        source: {fred: LNS12300060}
        transform: level
        normalize: {method: zscore, window: 240}
        direction: -1
        weight: 0.10
        why: Rising participation relieves the constraint. Inverted.

      - id: supply_chain_pressure
        label: Global supply chain pressure
        source: {fred: GSCPI}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.0}
        direction: 1
        weight: 0.20
        why: Input bottlenecks from shipping, delivery times and backlogs, out days after month end.

  policy:
    label: Policy stance
    description: Combined monetary and fiscal restrictiveness.
    signpost:
      low: {label: Too loose, tone: risk}
      high: {label: Too tight, tone: risk}
      reverse: true
    indicators:
      - id: real_fed_funds
        label: Real fed funds rate
        source:
          expr: "FEDFUNDS - core_pce_yoy"
          fred: [FEDFUNDS, PCEPILFE]
          derived: {core_pce_yoy: {fred: PCEPILFE, transform: yoy_pct}}
        transform: level
        normalize: {method: gap, center: 0.5, scale: 1.2}
        direction: 1
        weight: 0.35
        anchor: true
        release: PCE report
        why: Nominal rates say nothing. Real rate vs r* is the stance.

      - id: ex_ante_real_rate
        label: Fed funds rate less 1-year expected inflation
        source:
          expr: "FEDFUNDS - EXPINF1YR"
          fred: [FEDFUNDS, EXPINF1YR]
        transform: level
        normalize: {method: gap, center: 0.5, scale: 1.2}
        direction: 1
        weight: 0.15
        why: Forward-looking real rate, available weeks before core PCE.

      - id: financial_conditions
        label: Financial conditions index
        source: {fred: NFCI}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.5}
        direction: 1
        weight: 0.30
        why: Captures credit spreads and leverage the funds rate misses.

      - id: federal_deficit_gdp
        label: Federal budget balance, % of GDP
        source: {fred: FYFSGDA188S}
        transform: level
        normalize: {method: gap, center: -3.0, scale: 2.5}
        direction: -1
        weight: 0.20
        why: Wider deficit loosens the overall stance. Annual, so it lags.

  investment:
    label: Investment spending
    description: Capex momentum and the credit conditions behind it.
    signpost:
      low: {label: Low investment, tone: risk}
      high: {label: High investment, tone: good}
    indicators:
      - id: core_capex_orders_yoy
        label: Core capital goods orders, year over year
        source: {fred: NEWORDER}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.25
        why: Leading edge of business investment, monthly.

      - id: real_nonres_investment_yoy
        label: Real business investment, year over year
        source: {fred: PNFIC1}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.20
        why: The actual spend. Quarterly and heavily revised, hence vintages.

      - id: manufacturing_construction_yoy
        label: Manufacturing construction spending, year over year
        source: {fred: TLMFGCONS}
        transform: yoy_pct
        normalize: {method: gap, center: 5.0, scale: 12.0}
        direction: 1
        weight: 0.15
        why: Picks up reshoring and subsidy-driven building directly.

      - id: ci_lending_standards
        label: Banks tightening business lending standards, net %
        source: {fred: DRTSCILM}
        transform: level
        normalize: {method: gap, center: 5.0, scale: 20.0}
        direction: -1
        weight: 0.20
        why: Net tightening chokes capex with roughly two quarters of lag.

      - id: capex_plans_philadelphia
        label: Philadelphia Fed capital spending plans
        source: {fred: PHILCAPEX}
        transform: level
        normalize: {method: gap, center: 17.0, scale: 11.0}
        direction: 1
        weight: 0.10
        why: Manufacturers' own plans for the next six months, published in the same month.

      - id: capex_plans_empire
        label: Empire State capital spending plans
        source: {fred: EMPIRECAPEX}
        transform: level
        normalize: {method: gap, center: 20.0, scale: 10.0}
        direction: 1
        weight: 0.10
        why: Second regional read on capex intentions, released mid-month.

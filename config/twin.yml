# The twin: the live US model with a proposed indicator set swapped in.
#
# EMPTY ON PURPOSE, as of 24 September 2026. Every swap that was here has been
# adopted into config/indicators.yml, so there is nothing left for the twin to
# differ by and the /twin page reports the two models as identical. That is the
# proposal having been accepted, not the file having been abandoned.
#
# HOW IT WORKS. The twin is built at run time as the live config plus the
# differences listed here, so a change to the live model flows into the twin
# automatically and the two differ only where this file says. That is what
# makes the comparison mean something: any gap between the two calls is caused
# by the indicators, not by a centre or a salience drifting apart unnoticed.
#
# TO PROPOSE SOMETHING NEW, add it back under one of four keys:
#
#   swaps      one indicator out, one in. The incoming one inherits the
#              outgoing one's weight unless it states its own, so the driver
#              stays the same size.
#   adds       an indicator joins a driver outright. It must state a weight,
#              having nothing to inherit.
#   reweight   an existing weight changes. A value equal to the live one fails
#              a test rather than sitting there looking like a decision.
#   changes    an indicator is kept but read differently -- a new transform,
#              centre or scale.
#
# Centres and scales for anything new come from the series' own history to 2019
# where it has one (the live model's convention), otherwise from all of it.
# A revision to a growth RATE is centred on zero, because no revision is the
# neutral reading; a revision to a nominal LEVEL is not, because the level
# drifts with inflation and trend growth.
#
# WHAT WAS LEARNED HERE, so the next proposal does not relitigate it:
#
#   - The ex-post scorecard cannot rank two reasonable indicator choices. Every
#     variant tried sat inside roughly a 15-point interval and overlapped the
#     naive always-Goldilocks baseline. Use it as a floor test, not a ranking.
#   - Nor can a forward-looking test, at the horizon these indicators are for.
#     Simulated on 55 years of monthly data, the three-year test finds a TRUE
#     correlation of 0.3 only 38% of the time. Failing it is weak evidence.
#   - So indicators are chosen on construct validity, and the tests that do
#     have power are the negative ones: the CBO potential-growth revision
#     correlating +0.44 with growth already published; analysts' expected
#     growth RATE rising through all four recessions because its base is the
#     near-term year that collapses; homebuilders scoring +0.68 to 2012 and
#     -0.00 after, one housing episode wearing an indicator's clothes.
#   - Always split the sample before believing a headline correlation.
#
# LICENSING. Four series in the live set now come from the Bloomberg terminal
# (CDS5Y_US, HYOAS, SPX_RETL, SPX_CONS). `ingest.py publish` refuses to push
# them unless --allow-licensed is passed, which is deliberate and recorded in
# the snapshot manifest.

swaps: {}
adds: {}
reweight: {}
changes: {}

# Each regime is a point in driver space. The engine scores the current driver
# vector by distance to each archetype and softmaxes.
#
# Driver scales run -1 (cold / loose / slack) to +1 (hot / tight / restrictive).
#
# These numbers are opinions. Argue with them, change them, and let the diff
# explain why the regime call moved. That is the whole point of keeping them
# in a config file rather than in code.
#
# Monetary archetypes carry over from the single policy driver. Fiscal
# archetypes follow the ordering on the scenario slide, small to large fiscal:
# hard landing, then goldilocks and high growth, then stagflation. Neither has
# been validated against history.

settings:
  temperature: 0.30        # lower = sharper calls, higher = flatter probabilities
  persistence_months: 3    # consecutive months a new leader needs before it is called
  min_confidence: 0.35     # below this, report "transitional" rather than a regime
  # Probabilities alone are relative and turn middling months into whichever
  # archetype sits nearest the center. The fit gate measures each month against
  # a neutral economy (every driver at zero): closer to the nearest archetype
  # than neutral is a clear fit; within fit_tolerance times neutral's distance
  # a weak fit, still called but flagged; beyond it, "no clear regime".
  # Tolerance 1.0 left 53% of months since 1990 unclassified, most only just;
  # 1.25 leaves 19%, keeps every shock classified, and still reports 2012-14
  # and 2015-17 as no clear regime. Set fit_gate to none to switch it off.
  fit_gate: closer_than_neutral
  fit_tolerance: 1.25

driver_salience:           # how much each driver matters when measuring distance
  demand: 1.0
  inflation_expectations: 1.2
  supply: 1.0
  monetary: 0.7
  fiscal: 0.5
  investment: 0.9

# Why each default is what it is. Shown next to the control in the control
# room, so a reader changing a number can see the argument they are overruling.
# Keep each to a sentence or two.
rationale:
  driver_salience:
    demand: >-
      Full weight. Growth is the first thing every regime disagrees about, and
      it is measured better than anything else here.
    inflation_expectations: >-
      Above full weight, the highest of the six. Whether expectations stay
      anchored is what separates a hot expansion from stagflation, and it is
      the one driver whose damage is hard to undo once it moves.
    supply: >-
      Full weight. Whether inflation comes from demand outrunning capacity or
      from capacity itself is the core distinction between goldilocks and
      stagflation.
    monetary: >-
      Below full weight. Policy largely responds to the other drivers, so
      counting it fully would double count what demand and inflation already
      say.
    fiscal: >-
      Lowest weight. Reported with a lag, dominated by automatic stabilizers
      that echo demand, and its archetype values are the least validated in the
      config.
    investment: >-
      Just below full weight. Capex leads turning points, which earns it a high
      weight, but it is noisy month to month, which stops it reaching 1.0.
  settings:
    temperature: >-
      0.30 leaves the nearest regime around 70 to 80% when one archetype is
      clearly closest, without pinning it at 100% and hiding the runner-up.
      Lower sharpens the call, higher flattens it.
    persistence_months: >-
      Three months is one quarter: long enough to ignore a single odd print,
      short enough to catch a genuine turn within a quarter.
    min_confidence: >-
      0.35 sits meaningfully above the 25% four regimes would each get at
      random, so "transitional" means the regimes really are bunched.
    fit_gate: >-
      On. Probabilities are relative and always sum to 100%, so without an
      absolute check every quiet month becomes whichever archetype sits nearest
      the center, which is goldilocks.
    fit_tolerance: >-
      1.25. With no tolerance at all, 53% of months since 1990 fit nothing, most
      of them only just, and the shock episodes come out full of holes. At 1.25
      it is 19%, every shock stays whole, and the 2012 to 2017 recovery still
      reports as no clear regime.

# `short` is the code shown on the signpost chart. `color` follows the regime
# everywhere it appears; the four were checked together for color-blind
# separation on a white page, so re-check if you change one.

regimes:

  goldilocks:
    label: Goldilocks
    short: GLD
    color: "#008300"
    description: Demand grows into expanding supply. Expectations stay anchored.
    archetype:
      demand: 0.40
      inflation_expectations: 0.00
      supply: -0.40
      monetary: 0.00
      fiscal: -0.10
      investment: 0.50
    tell: Capex growth running ahead of demand growth with breakevens flat.

  high_growth_high_inflation:
    label: High growth, high inflation
    short: HGHI
    color: "#2a78d6"
    description: Demand outruns supply. Policy has not yet caught up.
    archetype:
      demand: 0.80
      inflation_expectations: 0.60
      supply: 0.55
      monetary: -0.30
      fiscal: -0.30
      investment: 0.60
    tell: Utilization above average and rising while the real policy rate is negative.

  stagflation:
    label: Stagflation
    short: STF
    color: "#e34948"
    description: Supply binds while demand fades. Expectations drift up anyway.
    archetype:
      demand: -0.30
      inflation_expectations: 0.70
      supply: 0.80
      monetary: 0.30
      fiscal: -0.50
      investment: -0.40
    tell: Unit labor costs accelerating while capex orders contract.

  hard_landing:
    label: Hard landing
    short: HL
    color: "#eda100"
    description: Policy restriction bites. Demand and investment break together.
    archetype:
      demand: -0.80
      inflation_expectations: -0.40
      supply: -0.60
      monetary: 0.60
      fiscal: 0.50
      investment: -0.80
    tell: Lending standards tightening sharply with the unemployment gap opening.

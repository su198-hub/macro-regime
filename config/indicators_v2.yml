# The v2 signposts, October 2026.
#
# Five signposts, with supply folded into growth:
#
#   growth                 whether growth will beat potential over the next
#                          three years (the cycle block: slack and borrowing,
#                          75%), and whether potential growth itself is
#                          rising (revisions to it and its parts, 25%)
#   inflation              whether inflation will beat expected inflation over
#                          the next three years (the pressure block: money,
#                          house prices, underlying inflation, 75%), and
#                          whether long-run expectations are drifting from 2%
#                          (the anchoring block, 25%)
#   monetary               how hawkish the central bank is: stance (the yield
#                          curve, the hiking pace, the real rate against
#                          neutral, 50%) and credibility (the record against
#                          2% and the Taylor gap, 50%)
#   fiscal                 how supportive fiscal policy is: impulse (37.5%),
#                          debt dynamics, r - g (37.5%), and the investment
#                          share of spending (25%); half weight in the call
#   reforms                how far reforms and industrial policy draw in
#                          private investment, read through the investment
#
# Every score runs from its left pole (-1) to its right pole (+1):
# weak to strong, de-anchored lower to higher, dovish to hawkish,
# restrictive to supportive, reactive to proactive.
# That differs from v1, where +1 meant hot, tight or restrictive.
#
# Indicators follow the agreed list, except B-Ready and Global Trade Alert,
# listed under reforms, which have no history to score yet. A fiscal
# multiplier axis was tried and left out for now. The reason for each indicator opens with the item on
# the list it measures, in bold. Centers and scales come from each series' history
# to 2019 where it has one, otherwise all of it; for inflation and
# credibility, 1990-2019, the inflation-targeting era, as in v1. Revisions
# and changes are centered on zero, absolute anchors (2% inflation, r = g,
# the Taylor rule) on the anchor.

meta:
  region: US
  base_frequency: M
  # Read by the dashboard and the methodology page, so each framework
  # describes itself rather than borrowing v1's words.
  sign: >-
    positive means stronger growth, inflation de-anchored higher, a more
    hawkish central bank (tighter and more credible), more supportive fiscal
    policy and more proactive reform
  framework_note: >-
    Five signposts. Growth and inflation each have two blocks: one reads the
    next three years (growth against potential, inflation against expected
    inflation), the other the long run (potential growth itself, and whether
    inflation expectations are drifting from 2%). Monetary policy reads how
    hawkish the Fed is, from its stance and its credibility. Fiscal policy
    reads how supportive the budget is, mainly a signal for inflation, and
    takes half weight in the regime call.
  summary_note: >-
    The scenario positions are judgments, not estimates. Against the labeled
    history they fit poorly: goldilocks is never the leading scenario after
    1990.
  limitations:
    - title: Scenario positions fit the labeled history poorly
      text: >-
        Graded against the Regime history page from 1990, the leading scenario
        matches the labeled regime in 18% of months (v1: 64%), and goldilocks
        is never the leading scenario: it sits far from neutral, and high
        growth, high inflation sits halfway along the same line, so every good
        month lands there. 30% of months fit no scenario. The positions were
        set before growth and inflation were reworked to read the next three
        years, and have not been moved since. Baseline cannot be
        graded at all: the labels have only the four growth-inflation regimes.
    - title: Potential growth is there by design, not for the forecast
      text: >-
        The labeled regime reads growth against potential, so revisions to
        potential raise the bar rather than predict clearing it: on their own
        they correlate -0.35 to +0.03 with the next three years' growth gap.
        They are kept, at 25% of growth, to hold the long-run view in the
        driver; at that weight they cost the three-year call about three
        points. The cycle block does the forecasting: +0.55 with the next
        three years' gap, 1985-2023, and the right sign in both halves.
    - title: Inflation expectations are there by design, not for the forecast
      text: >-
        The labeled regime reads inflation against expected inflation, so the
        anchoring measures are the bar itself: on their own they correlate
        -0.46 to +0.30 with the next three years' inflation gap, and the
        breakeven and Cleveland measures have the wrong sign. They are kept, at
        25% of inflation, to hold the long-run view. The pressure block does
        the forecasting: +0.52 with the next three years' gap, 1985-2023, and
        the right sign in both halves. Before 1991 it is money and house
        prices alone; underlying inflation starts with the forecasters' survey.
    - title: A 2% anchor before there was a target
      text: >-
        Inflation is read against 2%. Before the late 1990s expectations ran at
        4 to 5%, so those years all read as de-anchored higher.
    - title: Hawkish is not the same as good
      text: >-
        Monetary reads tight and credible policy as hawkish. Both point the
        same way in the data: hard landings came after tight policy, and after
        spells of low, steady inflation, when a slowdown brings inflation down
        rather than up. The scenario positions were set when this signpost read
        credibility alone, with hard landing on the losing-credibility side,
        and have not been moved yet.
    - title: Credibility is a track record only
      text: >-
        The miss rate, volatility and trajectory look back. Since 2021 they
        read as losing credibility while long-run breakevens held near 2.3%; a
        market anchor is not in the signpost.
    - title: Fiscal policy reads change, not the size of the deficit
      text: >-
        The impulse block reads whether the deficit is widening or narrowing,
        not how large it is: a 3% primary deficit that is shrinking reads as
        restrictive. The level of the deficit and of the debt were tested and
        left out; on their own their signs flip between periods. What the
        multiplier depends on in the data is debt: below 60% of GDP, fiscal
        loosening went with stronger growth; above it, mostly with higher
        inflation. That rests largely on 2020-21. Weighting spending and taxes
        by CBO's multipliers predicted no better than the plain total.
    - title: Proposed, thin or contaminated inputs
      text: >-
        The potential-growth block starts in 1993: the forecasters'
        productivity revision is annual from then, the CBO revisions start in
        1997 and 2003, and the capex consensus in 2009. Before 1993 growth is
        the cycle block alone. Company and household debt come from the BIS
        about two quarters after the quarter ends. Growth and reforms both lean
        on the AI capex surge, which is investment, not policy. B-Ready and
        Global Trade Alert are not included.
    - title: Settings carried over from v1
      text: >-
        Temperature, the fit gate and the persistence rule are v1's, not yet
        tested for five scenarios.
  history_start: "1970-01-01"
  carry_forward_periods: 2
  min_reported_share: 0.6
  provisional:
    fill_months: 2
    min_reported_share: 0.5
  horizons:
    short: []
    medium:
      - unemployment_gap
      - capacity_utilization_gap
      - company_credit_real_3y
      - household_credit_real_3y
      - m2_growth_3y
      - house_prices_3y
      - underlying_inflation_gap
      - yield_curve
      - hiking_pace_3y
      - real_rate_gap
      - taylor_gap
      - core_capex_orders_yoy
      - real_nonres_investment_yoy
      - capex_revision
      - forecaster_disagreement
      - inflation_trajectory
      - outlays_vs_receipts
      - primary_balance_3y
    long:
      - cbo_potential_growth_revision
      - spf_productivity_revision
      - cbo_labour_force_revision
      - breakeven_5y5y
      - cleveland_10y
      - spf_cpi_revision
      - inflation_risk_premium
      - target_miss_rate
      - inflation_volatility
      - r_minus_g
      - capb_3y_change
      - federal_investment_share
      - investment_share_vs_norm
      - equity_risk_premium

drivers:

  growth:
    label: Growth
    description: >-
      Whether growth will run above or below potential over the next three
      years, and whether potential growth itself is rising.
    signpost:
      low: {label: Weak, tone: risk, phrase: the growth outlook is weakening}
      high: {label: Strong, tone: good, phrase: the growth outlook is improving}
      mid: {phrase: the growth outlook is steady}
    # Two blocks, scored separately and then combined 75/25. Each indicator's
    # weight is its share of the driver; a block's weight is the sum of its
    # indicators'. When a block has no readings (potential growth before 1993),
    # the driver is the other block alone.
    groups:
      cycle:
        label: Cycle
        description: >-
          Room to grow over the next three years: spare capacity, and borrowing
          that will have to be paid back.
      potential:
        label: Potential growth
        description: >-
          Revisions to potential growth and its parts: the economy's long-run
          speed, from labor, capital and productivity.
    indicators:
      - id: unemployment_gap
        group: cycle
        label: Unemployment rate less CBO's long-run rate
        source:
          expr: "UNRATE - NROU"
          series: [UNRATE, NROU]
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.46}
        direction: 1
        weight: 0.1875
        # CBO revises its long-run rate once or twice a year and it moves
        # slowly, so hold it for up to six quarters.
        carry_forward_periods: 6
        release: Employment report
        why: >-
          **Slack in the labor market.** Potential growth is how fast output
          can grow once everyone who wants a job has one. With unemployment
          above its long-run rate, output sits below potential, and as idle
          workers are rehired it grows faster than potential until the gap
          closes. Below the long-run rate there is no room left, and growth
          usually slows back toward potential.

      - id: capacity_utilization_gap
        group: cycle
        label: Capacity utilization less its 10-year average
        source: {series: TCU}
        transform: dev_10y
        normalize: {method: gap, center: 0.0, scale: 3.07}
        direction: -1
        weight: 0.1875
        release: Industrial production report
        why: >-
          **Slack in plants and machines.** With spare capacity, firms can
          raise output by running existing plants harder, so production can
          outgrow potential without waiting for new investment. Running hotter
          than usual, more output needs new capacity first, so costs rise and
          growth slows. Read against its own 10-year average because
          utilization has drifted down for decades as the economy moved to
          services.

      - id: company_credit_real_3y
        group: cycle
        label: Company debt, real growth over three years
        source:
          expr: "credit_growth - price_growth"
          series: [BIS_NFC_CREDIT, PCEPILFE]
          derived:
            credit_growth: {series: BIS_NFC_CREDIT, transform: pct_change_3y_ann}
            price_growth: {series: PCEPILFE, transform: pct_change_3y_ann}
        transform: level
        normalize: {method: gap, center: 3.9, scale: 3.4}
        direction: -1
        weight: 0.1875
        # BIS publishes about two quarters after the quarter ends.
        carry_forward_periods: 3
        release: BIS credit statistics
        why: >-
          **Borrowing by companies.** Companies that borrow fast are spending
          beyond their cash flow, mostly on investment. That lifts demand now
          but borrows it from later: the debt has to be serviced, and if the
          investment earns less than hoped, firms cut capex and hiring to
          repair their balance sheets. Fast growth means a payback ahead, as
          after the dot-com boom; slow growth means nothing has to unwind.
          Net of core inflation, because inflation shrinks debt in real terms.

      - id: household_credit_real_3y
        group: cycle
        label: Household debt, real growth over three years
        source:
          expr: "credit_growth - price_growth"
          series: [BIS_HH_CREDIT, PCEPILFE]
          derived:
            credit_growth: {series: BIS_HH_CREDIT, transform: pct_change_3y_ann}
            price_growth: {series: PCEPILFE, transform: pct_change_3y_ann}
        transform: level
        normalize: {method: gap, center: 4.27, scale: 3.84}
        direction: -1
        weight: 0.1875
        carry_forward_periods: 3
        release: BIS credit statistics
        why: >-
          **Borrowing by households.** Households that borrow faster than
          their incomes grow pull spending on homes and goods forward, and a
          rising share of income goes to debt payments. Once borrowing stops,
          because rates rise or house prices fall, spending has to grow slower
          than income for years while the debt is paid down, as after 2008.
          Kept apart from company debt because the two drive different busts.

      - id: cbo_potential_growth_revision
        group: potential
        label: Revision to CBO potential growth, next five years
        source: {series: CBO_POTGROWTH_REV}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.16}
        direction: 1
        weight: 0.0625
        carry_forward_periods: 2
        why: >-
          **Changes in potential growth.** CBO rebuilds potential from labor,
          capital and productivity at each projection, so a revision means
          new evidence about the trend has arrived, such as productivity
          running faster than assumed.

      - id: spf_productivity_revision
        group: potential
        label: Revision to forecasters' 10-year productivity growth
        source: {series: SPF10PROD}
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 0.20}
        direction: 1
        weight: 0.0625
        carry_forward_periods: 2
        release: Survey of Professional Forecasters
        why: >-
          **Revisions to productivity estimates.** Productivity is the lasting
          source of growth. Forecasters raise their ten-year view when they
          judge a change is durable, such as a new technology spreading
          through firms: a forward view of what the trailing pace records.

      - id: capex_revision
        group: potential
        label: Revision to the S&P 500's three-year capex consensus
        source: {series: SPX_CAPEX_3FY}
        transform: yoy_pct
        normalize: {method: gap, center: 3.1, scale: 8.8}
        direction: 1
        weight: 0.0625
        release: Bloomberg consensus
        why: >-
          **Revision to capex plans.** More machines, data centers and
          software per worker raise output per hour once they are built.
          Upgraded spending plans are the earliest read on tomorrow's capital
          stock.

      - id: cbo_labour_force_revision
        group: potential
        label: Revision to CBO potential labor force
        source: {series: CBO_LABFORCE_REV}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.54}
        direction: 1
        weight: 0.0625
        carry_forward_periods: 2
        why: >-
          **Revision to the labor force.** Potential growth is growth in
          workers plus growth in output per worker. Immigration, retirement
          and participation move the first for a decade at a time.

  inflation:
    label: Inflation
    description: >-
      Whether inflation will run above or below expected inflation over the
      next three years, and whether long-run expectations are drifting from
      the 2% target.
    signpost:
      low: {label: De-anchored lower, tone: risk, phrase: inflation pressure is easing below its anchor}
      high: {label: De-anchored higher, tone: risk, phrase: inflation pressure is building above its anchor}
      mid: {phrase: inflation is anchored}
    # Two blocks, as for growth: pressure (75%) and anchoring (25%).
    groups:
      pressure:
        label: Pressure
        description: >-
          What pushes inflation away from expectations over the next three
          years: money, house prices, and where underlying inflation starts.
      anchoring:
        label: Anchoring
        description: >-
          Whether long-run inflation expectations are drifting from the 2%
          anchor, read from forecasters, markets and a model.
    indicators:
      - id: m2_growth_3y
        group: pressure
        label: M2 money supply, three-year annualized growth
        source: {series: M2SL}
        transform: pct_change_3y_ann
        normalize: {method: gap, center: 5.43, scale: 1.73}
        direction: 1
        weight: 0.25
        release: Fed H.6
        why: >-
          **Money growth.** Prices rise when spending outgrows what the economy
          can supply, and spending needs money: when money grows much faster
          than the economy, the excess eventually chases goods and services.
          It is also where Fed easing and deficit financing meet, since both
          create deposits. The link is strongest when inflation is already
          elevated, and weak when money sits idle in bank reserves, as in 2009.

      - id: house_prices_3y
        group: pressure
        label: House prices (Case-Shiller national), three-year annualized growth
        source: {series: CSUSHPISA}
        transform: pct_change_3y_ann
        normalize: {method: gap, center: 3.65, scale: 4.8}
        direction: 1
        release: Case-Shiller
        weight: 0.25
        why: >-
          **House prices.** Shelter is the largest slow-moving part of core
          inflation. Rents and owners' equivalent rent follow house prices with
          a lag of a year or more as leases reset, and rising home values feed
          spending through household wealth. Misleads when a boom ends in a
          bust, as in 2006.

      - id: underlying_inflation_gap
        group: pressure
        label: Trimmed-mean PCE inflation less forecasters' 10-year CPI
        source:
          expr: "PCETRIM12M159SFRBDAL - SPFCPI10"
          series: [PCETRIM12M159SFRBDAL, SPFCPI10]
        transform: level
        normalize: {method: gap, center: -0.58, scale: 0.39}
        direction: 1
        weight: 0.25
        anchor: true
        carry_forward_periods: 2
        release: PCE report
        why: >-
          **Underlying inflation against expectations.** The trimmed mean drops
          each month's most extreme price changes and averages the rest, so it
          shows the broad pace of inflation rather than a few volatile items,
          and it gauges the trend better than core. Against long-run
          expectations it shows where inflation starts relative to the anchor.
          The most short-term of the three: such gaps tend to close within a
          couple of years. The anchor: a month is confirmed once the PCE report
          is out.

      - id: spf_cpi_revision
        group: anchoring
        label: Revision to forecasters' 10-year CPI
        source: {series: SPFCPI10}
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 0.14}
        direction: 1
        weight: 0.0625
        carry_forward_periods: 2
        release: Survey of Professional Forecasters
        why: >-
          **Revisions to forecasters' 10-year CPI.** Forecasters move their
          long-run view when inflation is already building, so a revision up is
          an early sign the anchor is being tested.

      - id: breakeven_5y5y
        group: anchoring
        label: 5-year inflation expectations, 5 years ahead
        source: {series: T5YIFR}
        transform: level
        normalize: {method: gap, center: 2.3, scale: 0.35}
        direction: 1
        absolute_level: true
        weight: 0.0625
        why: >-
          **5Y5Y inflation expectations.** The market's view of inflation five
          to ten years out, past any cycle: where a de-anchoring would show
          first in prices.

      - id: cleveland_10y
        group: anchoring
        label: Cleveland Fed 10-year expected inflation
        source: {series: EXPINF10YR}
        transform: level
        normalize: {method: gap, center: 2.0, scale: 0.4}
        direction: 1
        absolute_level: true
        weight: 0.0625
        why: >-
          **10-year expected inflation.** A model blending Treasury yields,
          inflation swaps and surveys, against the 2% target.

      - id: inflation_risk_premium
        group: anchoring
        label: Inflation risk premium, 10 year
        source: {series: INFRISKPREM}
        transform: level
        normalize: {method: gap, center: 0.41, scale: 0.07}
        direction: 1
        absolute_level: true
        weight: 0.0625
        why: >-
          **Inflation risk premium.** What investors pay to insure against
          inflation surprises: it rises when they are less sure the anchor will
          hold.

  monetary:
    label: Monetary policy
    description: >-
      How hawkish the central bank is: whether policy is tight, and whether it
      is credible enough that a slowdown brings inflation down rather than up.
    signpost:
      low: {label: Dovish, tone: risk, phrase: policy is loose and its credibility slipping}
      high: {label: Hawkish, tone: neutral, phrase: policy is tight and credible}
      mid: {phrase: policy is close to neutral}
    # Two blocks at equal weight, both read as hawkish (+) or dovish (-).
    # Stance carries the timing of slowdowns and hard landings; credibility
    # decides whether a slowdown turns disinflationary or stagflationary.
    groups:
      stance:
        label: Stance
        description: >-
          Whether policy is squeezing the economy: the yield curve, how hard
          the Fed has tightened, and the real rate against neutral.
      credibility:
        label: Credibility
        description: >-
          Whether inflation stays anchored: the track record against 2%, and
          whether policy is behind the curve.
    indicators:
      - id: yield_curve
        group: stance
        label: 10-year Treasury yield less fed funds
        source:
          expr: "DGS10 - FEDFUNDS"
          series: [DGS10, FEDFUNDS]
        transform: level
        normalize: {method: gap, center: 1.6, scale: 1.24}
        direction: -1
        weight: 0.1667
        why: >-
          **The yield curve.** The 10-year yield is roughly the market's
          forecast of short rates over the next decade. Below fed funds, the
          market expects the Fed to cut, usually because it has tightened
          enough to slow the economy, and banks that borrow short and lend long
          tighten credit. Inverted reads as tight. Inversions came before 2001
          and 2008; the one from 2022 did not end in recession.

      - id: hiking_pace_3y
        group: stance
        label: Change in fed funds over three years, per year
        source: {series: FEDFUNDS}
        transform: diff_36m_ann
        normalize: {method: gap, center: 0.0, scale: 0.9}
        direction: 1
        weight: 0.1667
        why: >-
          **How hard the Fed has tightened.** Policy works with long lags, so a
          large cumulative hike keeps squeezing housing, investment and credit
          for a year or two after the last move, and big cycles have usually
          overshot. The 2004-06 cycle, 1% to 5.25%, came before 2008; the 1994
          cycle ended softly.

      - id: real_rate_gap
        group: stance
        label: Real fed funds less the neutral rate
        source:
          expr: "FEDFUNDS - core_pce_yoy - neutral_rate"
          series: [FEDFUNDS, PCEPILFE, SEPLR, HLWRSTAR]
          derived:
            core_pce_yoy: {series: PCEPILFE, transform: yoy_pct}
            neutral_sep: {expr: "SEPLR - 2"}
            neutral_rate: {first_of: [neutral_sep, HLWRSTAR]}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.52}
        direction: 1
        weight: 0.1666
        carry_forward_periods: 6
        release: PCE report
        why: >-
          **The real rate against neutral.** Policy restrains only when the
          real rate sits above neutral, the rate that neither speeds up nor
          slows the economy. Neutral is the FOMC's longer-run median less 2%
          from 2012, the New York Fed's one-sided Holston-Laubach-Williams
          estimate before; both are uncertain by a point or more.

      - id: taylor_gap
        group: credibility
        label: Fed funds less the Taylor rule rate
        source:
          expr: "FEDFUNDS - taylor_rate"
          series: [FEDFUNDS, PCEPILFE, UNRATE, NROU, SEPLR, HLWRSTAR]
          derived:
            core_pce_yoy: {series: PCEPILFE, transform: yoy_pct}
            neutral_sep: {expr: "SEPLR - 2"}
            neutral_rate: {first_of: [neutral_sep, HLWRSTAR]}
            output_gap: {expr: "2 * (NROU - UNRATE)"}
            taylor_rate:
              expr: "neutral_rate + core_pce_yoy + 0.5 * (core_pce_yoy - 2) + 0.5 * output_gap"
              floor: 0.125
        transform: level
        normalize: {method: gap, center: 0.0, scale: 0.98}
        direction: 1
        weight: 0.10
        release: PCE report
        carry_forward_periods: 6
        why: >-
          **Actual against the Taylor rule.** A Fed that lets the rate sit well
          below what inflation and slack call for is behind the curve and
          tolerating inflation. The current gap rather than its three-year
          average: it reads faster and predicts inflation better.

      - id: target_miss_rate
        group: credibility
        label: Share of the last 36 months off target
        source: {series: PCEPILFE}
        transform: off_target_share_36m
        normalize: {method: gap, center: 42.8, scale: 30.7}
        direction: -1
        weight: 0.10
        why: >-
          **Inflation against target, hit rate**, as its complement: the share
          of months missed. With a good record a slowdown pulls inflation down
          rather than up.

      - id: inflation_volatility
        group: credibility
        label: Inflation volatility, 36 months
        source: {series: PCEPILFE}
        transform: vol_36m
        normalize: {method: gap, center: 0.29, scale: 0.12}
        direction: -1
        weight: 0.10
        why: "**Inflation volatility**: steady inflation, even off target, is easier to believe than violent swings."

      - id: inflation_trajectory
        group: credibility
        label: Change in core inflation's distance from 2%, over a year
        source: {series: PCEPILFE}
        transform: target_distance_change_12m
        normalize: {method: gap, center: 0.0, scale: 0.42}
        direction: -1
        weight: 0.10
        why: >-
          **Inflation trajectory**: whether inflation is closing on target
          or drifting away from it.

      - id: forecaster_disagreement
        group: credibility
        label: Forecaster disagreement on inflation
        source: {series: SPFDISP}
        transform: level
        normalize: {method: gap, center: 0.68, scale: 0.21}
        direction: -1
        weight: 0.10
        carry_forward_periods: 2
        why: "**Forecaster disagreement on inflation**: when the anchor holds, forecasters agree on where inflation is going."

  fiscal:
    label: Fiscal policy
    description: >-
      How supportive fiscal policy is: whether it is adding to demand, whether
      the debt is being eroded by growth and inflation, and how much of the
      budget goes to investment.
    signpost:
      low: {label: Restrictive, tone: neutral, phrase: fiscal policy is restrictive}
      high: {label: Supportive, tone: neutral, phrase: fiscal policy is supportive}
      mid: {phrase: fiscal policy is roughly neutral}
    # Three blocks. Fiscal policy's distinct signal is inflation: its growth
    # signal overlaps the growth signpost's slack, so it takes half weight in
    # the regime call (config/regimes_v2.yml).
    groups:
      impulse:
        label: Impulse
        description: Whether fiscal policy is adding to demand, read three ways.
      debt:
        label: Debt dynamics
        description: Whether the interest rate on the debt runs below the economy's nominal growth.
      composition:
        label: Composition
        description: How much of federal spending goes to investment rather than consumption and transfers.
    indicators:
      - id: capb_3y_change
        group: impulse
        label: Cyclically adjusted primary balance, three-year change (loosening +)
        source: {series: OECD_CAPB}
        transform: diff_36m_ann
        normalize: {method: gap, center: 0.0, scale: 0.80}
        direction: -1
        weight: 0.125
        carry_forward_periods: 2
        why: >-
          **Fiscal impulse, adjusted for the cycle.** The primary balance is
          revenue less non-interest spending; the OECD strips out what the
          business cycle does to it on its own (tax receipts falling and
          benefits rising in a downturn), leaving the part set by policy. A
          falling balance means policy is adding to demand. Read as the change
          over three years, per year.

      - id: primary_balance_3y
        group: impulse
        label: Federal primary balance, % of GDP, three-year change (loosening +)
        source:
          expr: "(balance_12m + interest_12m) / GDPNOM * 100"
          series: [MTSBAL, MTSNETINT, GDPNOM]
          derived:
            balance_12m: {series: MTSBAL, transform: sum_12m}
            interest_12m: {series: MTSNETINT, transform: sum_12m}
        transform: diff_36m_ann
        normalize: {method: gap, center: 0.0, scale: 1.08}
        direction: -1
        weight: 0.125
        release: Monthly Treasury Statement
        why: >-
          **Fiscal impulse, monthly.** The same balance from the Treasury's
          monthly accounts: the deficit summed over 12 months, with interest
          added back, against GDP. Not adjusted for the cycle, so it also picks
          up recessions, but it is current to the month.

      - id: outlays_vs_receipts
        group: impulse
        label: Federal outlays growth less receipts growth, three years
        source:
          expr: "outlays_growth - receipts_growth"
          series: [MTSRECEIPTS, MTSOUTLAYS]
          derived:
            receipts_12m: {series: MTSRECEIPTS, transform: sum_12m}
            outlays_12m: {series: MTSOUTLAYS, transform: sum_12m}
            receipts_growth: {series: receipts_12m, transform: pct_change_3y_ann}
            outlays_growth: {series: outlays_12m, transform: pct_change_3y_ann}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 4.98}
        direction: 1
        weight: 0.125
        release: Monthly Treasury Statement
        why: >-
          **Revenue against expenditure trajectory.** Annualized growth of
          federal spending over three years less that of revenue. Spending
          outrunning revenue widens the deficit and adds to demand; revenue
          outrunning spending, as with higher tariffs or tax receipts, takes
          demand out.

      - id: r_minus_g
        group: debt
        label: Interest rate on the debt less nominal GDP growth (low +)
        source:
          expr: "eff_rate - ngdp_growth"
          series: [MTSNETINT, DEBTPUB, GDPNOM]
          derived:
            interest_12m: {series: MTSNETINT, transform: sum_12m}
            eff_rate: {expr: "interest_12m / DEBTPUB * 100"}
            ngdp_growth: {series: GDPNOM, transform: pct_change_3y_ann}
        transform: level
        normalize: {method: gap, center: 0.0, scale: 1.42}
        direction: -1
        absolute_level: true
        weight: 0.375
        release: Monthly Treasury Statement
        why: >-
          **Trajectory of the debt stock (r − g).** The average rate the
          government pays on its debt (12 months of net interest over debt
          held by the public) less nominal GDP growth over three years. Below
          zero, the debt ratio shrinks without being repaid, because the
          economy's nominal size outgrows the interest bill; historically that
          has come before higher inflation, as debt is eroded by inflation
          rather than paid down.

      - id: federal_investment_share
        group: composition
        label: Federal investment, % of non-interest spending
        source:
          expr: "FEDGROSSINV / (FED_CONSUMPTION + FEDGROSSINV + FED_BENEFITS + FED_GRANTS + FED_SUBSIDIES) * 100"
          series: [FEDGROSSINV, FED_CONSUMPTION, FED_BENEFITS, FED_GRANTS, FED_SUBSIDIES]
        transform: level
        normalize: {method: gap, center: 13.36, scale: 4.93}
        direction: 1
        absolute_level: true
        weight: 0.25
        carry_forward_periods: 2
        why: >-
          **What the money is spent on.** Investment (infrastructure, R&D,
          equipment) adds to the economy's capacity; consumption and transfers
          support demand now. A budget tilted toward investment should lift
          long-run growth. The share fell from about 20% in the 1960s to under
          7%; against the next decade's growth it holds up even with that
          trend removed, though only modestly.

  reforms:
    label: Reforms and industrial policy
    description: >-
      How far reforms and industrial policy are drawing in private
      investment, read through the investment itself. B-Ready and Global
      Trade Alert have no history to score yet.
    signpost:
      low: {label: Reactive / limited, tone: risk, phrase: private investment is not responding}
      high: {label: Proactive / extensive, tone: good, phrase: private investment is responding}
      mid: {phrase: private investment is steady}
    indicators:
      - id: investment_share_vs_norm
        label: Business investment share of GDP, against its 10-year norm
        source: {series: NONRESSHARE}
        transform: dev_10y
        normalize: {method: gap, center: 0.0, scale: 0.92}
        direction: 1
        weight: 0.25
        carry_forward_periods: 2
        why: "**GFCF as a % of GDP**: business investment's share, in points above its own decade."

      - id: core_capex_orders_yoy
        label: Core capital goods orders, year over year
        source: {series: NEWORDER}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.25
        why: "**Capital goods orders**: the leading edge of business investment, monthly."

      - id: real_nonres_investment_yoy
        label: Real business investment, year over year
        source: {series: PNFIC1}
        transform: yoy_pct
        normalize: {method: gap, center: 3.5, scale: 3.0}
        direction: 1
        weight: 0.25
        carry_forward_periods: 2
        why: "**Real business investment growth**, quarterly."

      - id: equity_risk_premium
        label: Change in equity risk premium
        source:
          expr: "100 / CAPE - (DGS10 - EXPINF10YR)"
          series: [CAPE, DGS10, EXPINF10YR]
        transform: diff_12m
        normalize: {method: gap, center: 0.0, scale: 0.92}
        direction: -1
        weight: 0.25
        why: >-
          **Equity risk premium**: E10/P less the real 10-year yield, changed
          over a year. A falling
          premium is cheaper equity capital for the investment the policy
          wants.

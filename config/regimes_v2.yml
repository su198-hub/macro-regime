# The v2 scenarios, placed on the v2 signposts (config/indicators_v2.yml).
#
# Scores run from the left pole to the right: weak to strong growth,
# inflation de-anchored lower to higher, dovish to hawkish, fiscal
# restrictive to supportive, reforms reactive to proactive.
#
# The regime call describes the next three years. Each scenario's position
# (archetype) is where the signposts sat in the run-up to that regime, learned
# from 1983-2023 and shrunk toward the prior: the judgment of where each
# scenario sits, on the -1 to +1 scale, translated to what each signpost now
# reads (see rationale.prior). Positions are written by
#     python scripts/realign_positions.py --write
# which also grades the call; do not edit them by hand. Baseline has no label
# in the answer key, so its position is the average month, shrunk the same way.

settings:
  temperature: 0.20
  persistence_months: 3
  min_confidence: 0.25
  fit_gate: none
  fit_tolerance: 1.25

driver_salience:
  growth: 1.0
  inflation: 1.0
  monetary: 1.0
  fiscal: 0.5
  reforms: 0.5

rationale:
  driver_salience:
    growth: >-
      Full weight. The first signpost, and the one that separates
      goldilocks from the rest.
    inflation: >-
      Full weight. Whether the anchor holds separates high growth, high
      inflation from goldilocks, and stagflation from a hard landing.
    monetary: >-
      Full weight. Credibility is what decides whether an inflation shock
      becomes stagflation.
    fiscal: >-
      Half weight. Its growth signal overlaps the growth signpost's slack:
      deficits widen in downturns and recoveries follow. Its own contribution
      is inflation. Graded on the next three years, 1993-2023, at full weight
      it lowered the call on top of growth, inflation and monetary policy
      (51% to 43% of regimes right on average, held out); at half weight it
      kept 51% and improved the probabilities.
    reforms: >-
      Half weight. Reforms is there for the long run: the signpost goes with
      faster productivity over the following decade (+0.47, trend removed),
      but with the next three years' growth gap it runs the wrong way (-0.43:
      policy uncertainty spikes in recessions, and recoveries follow). Graded
      on the next three years, 1993-2023, held out, the call is about the same
      at a quarter or half weight and loses about eight points at full weight.
  settings:
    temperature: >-
      0.20. Run-up positions sit close together, so the probabilities are
      modest at any temperature; 0.15 to 0.20 gave the lowest held-out log
      loss (1.37 to 1.38 against 1.43 at 0.30).
    persistence_months: >-
      Three months, as in v1. One, two and six months each did slightly
      worse held out (56%, 56% and 54% against 57%).
    min_confidence: >-
      0.25. With five scenarios an even split is 20% each. At 0.35 a third
      of months came out transitional and the call lost 14 points held out.
    fit_gate: >-
      Off. The gate asks whether a month is closer to its scenario than a
      neutral economy would be. Run-up positions sit near neutral, so it
      left half of all months unclassified.
    fit_tolerance: >-
      1.25, as in v1; unused while the gate is off.
  prior: >-
    The judgment of where each scenario sits, before the data. Growth,
    inflation and reforms keep their direction. Monetary policy now reads
    hawkish rather than credible; a credible central bank leans hawkish, so
    the numbers carry over. Fiscal policy now reads supportive rather than
    sustainable, so it is placed from each scenario's story: public
    investment crowding in private investment (high growth, high inflation)
    is the most supportive, then goldilocks and stagflation, where deficits
    persist; baseline and hard landing sit at neutral. The prior counts as
    half an episode; at one episode or more it pulled the positions outward
    and the call fell from 57% to 40% or less, held out.

regimes:

  baseline:
    label: Baseline
    short: BSL
    color: "#4a5a7a"
    # The average month: it sits mid-row on every signpost, so the chart
    # leaves it out. It stays in the call and the probabilities.
    on_signpost_chart: false
    description: Growth constrained by supply-side bottlenecks; sticky prices strain inflation anchors.
    prior:
      growth: 0.00
      inflation: 0.33
      monetary: 0.67
      fiscal: 0.00
      reforms: 0.00
    archetype:
      growth: 0.05
      inflation: 0.17
      monetary: -0.03
      fiscal: -0.03
      reforms: -0.05
    tell: Growth near trend, inflation a little above target, a credible central bank.

  goldilocks:
    label: Goldilocks
    short: GLD
    color: "#008300"
    description: A virtuous cycle of investment and returns raises labor productivity; expectations stay anchored.
    prior:
      growth: 0.67
      inflation: 0.00
      monetary: 0.67
      fiscal: 0.33
      reforms: 0.67
    archetype:
      growth: 0.18
      inflation: 0.08
      monetary: -0.20
      fiscal: -0.02
      reforms: -0.08
    tell: Productivity and capex plans rising together with expectations at target.

  high_growth_high_inflation:
    label: High growth, high inflation
    short: HGHI
    color: "#2a78d6"
    description: Public investment crowds in private; policymakers allow "good" inflation and expectations drift higher.
    prior:
      growth: 0.33
      inflation: 0.33
      monetary: 0.33
      fiscal: 0.67
      reforms: 0.33
    archetype:
      growth: 0.09
      inflation: 0.36
      monetary: -0.09
      fiscal: 0.20
      reforms: -0.12
    tell: Investment strong and inflation above target, with credibility stretched.

  stagflation:
    label: Stagflation
    short: STF
    color: "#e34948"
    description: Growth strongly constrained by supply shocks; high realizations unanchor expectations.
    prior:
      growth: -0.67
      inflation: 0.67
      monetary: -0.67
      fiscal: 0.33
      reforms: -0.67
    archetype:
      growth: -0.29
      inflation: 0.33
      monetary: -0.22
      fiscal: -0.08
      reforms: -0.09
    tell: Expectations rising while credibility and the debt trajectory both weaken.

  hard_landing:
    label: Hard landing
    short: HL
    color: "#eda100"
    description: Strong investment not matched by strong returns; deflationary pressure de-anchors expectations lower.
    prior:
      growth: -0.67
      inflation: -0.67
      monetary: -0.33
      fiscal: 0.00
      reforms: -0.67
    archetype:
      growth: -0.13
      inflation: 0.17
      monetary: 0.10
      fiscal: -0.11
      reforms: 0.10
    tell: Expectations falling below target while growth prospects weaken.

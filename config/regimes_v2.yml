# The v2 scenarios, placed on the v2 signposts (config/indicators_v2.yml).
#
# Scores run from the left pole to the right: weak to strong growth,
# inflation de-anchored lower to higher, monetary stance dovish to hawkish,
# credibility losing to credible, fiscal restrictive to supportive, reforms
# reactive to proactive.
#
# The regime call describes the next three years. Each scenario's position
# (archetype) is where the signposts sat in the run-up to that regime, learned
# from 1968-2023 and shrunk toward the prior: the judgment of where each
# scenario sits, on the -1 to +1 scale, translated to what each signpost now
# reads (see rationale.prior). Positions are written by
#     python scripts/realign_positions.py --write
# which also grades the call; do not edit them by hand.
#
# Four scenarios, the four the answer key can grade. Baseline, the average
# month, was a fifth until October 2026: it could not be graded, sat in the
# middle of every signpost, and took about a quarter of the odds; at the time,
# dropping it raised the call from 59% to 63% held out and from 41% to 55% in
# real time, 1976-2023.

settings:
  temperature: 0.20
  persistence_months: 6
  min_confidence: 0.25
  fit_gate: none
  fit_tolerance: 1.25
  # The signpost chart places scenarios in order, evenly spaced (src/ui.py, ordinal_slots).
  signpost_layout: ordinal

driver_salience:
  growth: 1.0
  inflation: 1.0
  monetary: 0.5
  credibility: 0.5
  fiscal: 0.5
  reforms: 0.5

rationale:
  driver_salience:
    growth: >-
      Full weight. The first signpost, and the one that separates
      goldilocks from the rest.
    inflation: >-
      Full weight. Whether the anchor holds separates high growth, high
      inflation from goldilocks, and stagflation from a hard landing.
    monetary: >-
      Half weight, as is credibility: together they keep the full weight
      monetary policy had as one driver until 30 October 2026. Stance carries
      the timing: tight policy slows demand with a lag of a year or two, and
      the run-ups to stagflation and to a hard landing both came with policy
      on the tight side.
    credibility: >-
      Half weight, with stance. Credibility decides what a slowdown does to
      inflation: believed, a slowdown pulls inflation down (a hard landing);
      not believed, inflation stays high as growth weakens (stagflation). It
      is what tells those two run-ups apart. At equal weight within one
      driver the two cancelled when tight policy lacked credibility, as in
      1969-70, 1973-74, 1978-82, 1988-90 and 2022-25.
    fiscal: >-
      Half weight. Its growth signal overlaps the growth driver's slack:
      deficits widen in downturns and recoveries follow. Impulse and debt
      dynamics together correlate +0.24 with the next three years' inflation
      gap, about +0.5 in each half of 1971-2023. Graded on the next three years, 1993-2023, at full weight
      it lowered the call on top of growth, inflation and monetary policy
      (51% to 43% of regimes right on average, held out); at half weight it
      kept 51% and improved the probabilities.
    reforms: >-
      Half weight. Reforms is there for the long run: the signpost goes with
      faster productivity over the following decade (+0.44, trend removed),
      but with the next three years' growth gap it runs the wrong way (-0.37:
      policy uncertainty spikes in recessions, and recoveries follow). Graded
      on the next three years, 1993-2023, held out, the call is about the same
      at a quarter or half weight and loses about eight points at full weight.
  settings:
    temperature: >-
      0.20. Run-up positions sit close together, so the probabilities are
      modest at any temperature. On the six drivers, held-out log loss is 0.97
      at 0.20 and 0.25, against 1.03 at 0.15 and 0.98 at 0.30. The call
      itself is the same at every one of them.
    persistence_months: >-
      Six months since 30 October 2026, three before: two quarters, the rule
      of thumb for a recession, so a new regime has to show up in two
      quarters of data before the call moves. At three months the call
      flipped through short spells in the late 1980s, when the top two
      regimes were often within 25 points of each other (8, 9, 8 and 5-month
      calls from 1987 to 1991). Six months, 1976-2023, with five drivers: 66%
      held out, against 67% at three, and 0.29 changes a year against 0.31. Nine and twelve months fell to 64% and 63% held out and react later
      to real turns. Regraded on the six drivers (31 October 2026), three
      months does slightly better, 73% held out against 71%, within the noise, and the late-1980s flips no longer
      separate the two: splitting credibility from stance removed them, so
      1985-95 shows the same calls at three and at six. Six stays by choice
      (confirmed 2 November 2026), so a new regime has to show in two quarters
      of data, which suits a long-horizon call. The cost is moving about four
      months later on average at a turn. Today's call is the same either way.
    min_confidence: >-
      0.25. With four scenarios the leader always has at least 25%, so the
      floor never binds; it is kept so a reader can raise it in the control
      room. Set when there were five scenarios: at 0.35 a third of months came
      out transitional and the call lost 14 points held out.
    fit_gate: >-
      Off. The gate asks whether a month is closer to its scenario than a
      neutral economy would be. Run-up positions sit near neutral, so it
      left half of all months unclassified.
    fit_tolerance: >-
      1.25; unused while the gate is off.
  prior: >-
    The judgment of where each scenario sits, before the data. Growth,
    inflation and reforms keep their direction, and credibility the
    judgment's monetary axis. Monetary stance has no judgment behind it, so
    its prior is neutral for every scenario and its positions come from the
    data. Fiscal policy now reads supportive rather than
    sustainable, so it is placed from each scenario's story: public
    investment crowding in private investment (high growth, high inflation)
    is the most supportive, then goldilocks and stagflation, where deficits
    persist; hard landing sits at neutral. The prior counts as
    half an episode; at one episode or more it pulled the positions outward
    and the call fell from 57% to 40% or less, held out.

regimes:

  goldilocks:
    label: Goldilocks
    short: GLD
    color: "#008300"
    description: A virtuous cycle of investment and returns raises labor productivity; expectations stay anchored.
    prior:
      growth: 0.67
      inflation: 0.00
      monetary: 0.00
      credibility: 0.67
      fiscal: 0.33
      reforms: 0.67
    notes:
      during: >-
        The support from the run-up fades without anything breaking: the
        easing wears off and the slack gets used up.
      shifts:
        - >-
          Monetary stance tightens in all four spells. The cuts that set up
          the regime drop out of the three-year window and the curve flattens:
          -0.60 going into 2003-08, about neutral during it.
        - >-
          Growth cools in all four, as the slack behind the rebound is used.
          Unemployment reads +0.97 going in and +0.41 during, plant capacity
          +0.41 and -0.13. That is an expansion maturing, not a slump.
        - >-
          Credibility repairs as inflation stays steady, near zero in every
          spell since 1993. The 1980s are the exception: with the 1970s still
          fresh, it read -0.74 during.
    archetype:
      growth: 0.20
      inflation: 0.09
      monetary: -0.31
      credibility: -0.19
      fiscal: 0.05
      reforms: -0.08
    tell: Productivity and capex plans rising together with expectations at target.

  high_growth_high_inflation:
    label: High growth, high inflation
    short: HGHI
    color: "#2a78d6"
    description: Public investment crowds in private; policymakers allow "good" inflation and expectations drift higher.
    prior:
      growth: 0.33
      inflation: 0.33
      monetary: 0.00
      credibility: 0.33
      fiscal: 0.67
      reforms: 0.33
    notes:
      during: >-
        The averages barely move, and that hides two things: credibility keeps
        wearing down, and stance swings from one spell to the next.
      shifts:
        - >-
          Credibility falls further as inflation keeps overshooting. Target
          misses go from -1.00 to -1.68 and forecasters disagree more (-0.72
          to -1.34). It stays between -0.5 and -1.0 in every spell.
        - >-
          Monetary stance is what sets the spells apart: loose in 1975-79
          (-0.37), 1992-93 (-0.79) and 2021-22 (-0.58), tight in 1988-90
          (+0.49) and since 2023 (+0.53). The Fed has run this regime both
          ways, so an average near zero says little.
        - >-
          Growth eases as plants fill up. Spare capacity goes from +0.77 to
          -0.16, so more output starts to need new investment first.
        - >-
          Inflation stays high even as money growth fades (+1.69 to +0.91):
          the spending power built up in the run-up is still reaching prices.
    archetype:
      growth: 0.18
      inflation: 0.72
      monetary: -0.06
      credibility: -0.48
      fiscal: -0.01
      reforms: -0.31
    tell: Investment strong and inflation above target, with credibility stretched.

  stagflation:
    label: Stagflation
    short: STF
    color: "#e34948"
    description: Growth strongly constrained by supply shocks; high realizations unanchor expectations.
    prior:
      growth: -0.67
      inflation: 0.67
      monetary: 0.00
      credibility: -0.67
      fiscal: 0.33
      reforms: -0.67
    notes:
      during: >-
        Growth turns and inflation does not: the slump frees up room to
        recover, but inflation stays near the top of the scale and credibility
        barely repairs.
      shifts:
        - >-
          Growth rises from each run-up into its spell. Plants run hot going
          in (-0.67) and have room during (+0.77), and unemployment moves the
          same way (-0.39 to +0.22). The driver is reading room to recover, as
          when Volcker's squeeze gave way to the 1982 easing.
        - >-
          Inflation does not follow. It sat at the top of the scale in 1968-71,
          1973-75 and 1979-83 and read +0.93 in 2022-23; only 1990-92 came
          down quickly (+0.42).
        - >-
          Monetary stance looks flat, but only because each average spans a
          swing. Policy starts too loose, -0.85 three years before the 1979
          turn, tightens to +0.68 by the turn, reaches +0.90 early in the
          spell and eases to -0.37 by its end. Even so the real rate stays
          below neutral on average (-0.50 going in, -0.57 during), so the Fed
          only tightens a little.
        - >-
          Credibility repairs only a little as the Fed catches up. Rates sit
          less far behind what inflation called for (-2.03 to -1.46) and
          forecasters disagree less (-1.79 to -1.10).
        - >-
          Fiscal weakens as debt rolls over at higher rates: the interest bill
          reading goes from -0.83 to -1.46.
    archetype:
      growth: -0.27
      inflation: 0.82
      monetary: 0.23
      credibility: -0.82
      fiscal: -0.11
      reforms: -0.06
    tell: Expectations rising while credibility and the debt trajectory both weaken.

  hard_landing:
    label: Hard landing
    short: HL
    color: "#eda100"
    description: Strong investment not matched by strong returns; deflationary pressure de-anchors expectations lower.
    prior:
      growth: -0.67
      inflation: -0.67
      monetary: 0.00
      credibility: -0.33
      fiscal: 0.00
      reforms: -0.67
    notes:
      during: >-
        The biggest change of the four regimes, because the policy response
        arrives. Going in looks tight and calm; during, rates are being cut
        and deficits widened.
      shifts:
        - >-
          Monetary stance flips from tight to loose in all three. Hikes give
          way to cuts and the curve steepens from flat or inverted (+1.01) to
          normal (-0.19): -0.39 in 2000-03, -0.58 in 2008-10, -0.06 in the
          short 2019-21 spell.
        - >-
          Fiscal turns supportive in all three, as spending outruns revenue
          and the budget loosens: +0.24 in 2000-03, +0.48 in 2008-10, +0.75 in
          2019-21.
        - >-
          Growth rises in all three, which looks odd in a slump. The driver
          looks ahead: idle plants (+1.70) and jobless workers (+0.98) are room
          to recover, even while companies cut investment plans.
        - >-
          Policy uncertainty is low going in (+0.82, where higher means calmer)
          and high during (-0.75), so this measure gave little warning.
        - >-
          Inflation falls less than the name suggests. Only 2008-10 went below
          the anchor (-0.13); 2000-03 held at +0.29.
    archetype:
      growth: -0.15
      inflation: 0.15
      monetary: 0.19
      credibility: 0.01
      fiscal: -0.01
      reforms: 0.04
    tell: Expectations falling below target while growth prospects weaken.

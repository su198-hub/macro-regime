# The v2 scenarios, placed on the v2 signposts (config/indicators_v2.yml).
#
# Scores run from the left pole to the right: weak to strong growth,
# inflation de-anchored lower to higher, monetary stance dovish to hawkish,
# credibility losing to credible, fiscal restrictive to supportive, reforms
# reactive to proactive.
#
# The regime call describes the next three years. Each scenario's position
# (archetype) is where the signposts sat in the run-up to that regime, learned
# from 1968-2023 and shrunk toward the prior: the judgment of where each
# scenario sits, on the -1 to +1 scale, translated to what each signpost now
# reads (see rationale.prior). Positions are written by
#     python scripts/realign_positions.py --write
# which also grades the call; do not edit them by hand.
#
# Four scenarios, the four the answer key can grade. Baseline, the average
# month, was a fifth until October 2026: it could not be graded, sat in the
# middle of every signpost, and took about a quarter of the odds; at the time,
# dropping it raised the call from 59% to 63% held out and from 41% to 55% in
# real time, 1976-2023.

settings:
  temperature: 0.20
  persistence_months: 6
  min_confidence: 0.25
  fit_gate: none
  fit_tolerance: 1.25
  # The signpost chart places scenarios in order, evenly spaced (src/ui.py, ordinal_slots).
  signpost_layout: ordinal

driver_salience:
  growth: 1.0
  inflation: 1.0
  monetary: 0.5
  credibility: 0.5
  fiscal: 0.5
  reforms: 0.5

rationale:
  driver_salience:
    growth: >-
      Full weight. The first signpost, and the one that separates
      goldilocks from the rest.
    inflation: >-
      Full weight. Whether the anchor holds separates high growth, high
      inflation from goldilocks, and stagflation from a hard landing.
    monetary: >-
      Half weight, as is credibility: together they keep the full weight
      monetary policy had as one driver until 30 October 2026. Stance carries
      the timing: tight policy slows demand with a lag of a year or two, and
      the run-ups to stagflation and to a hard landing both came with policy
      on the tight side.
    credibility: >-
      Half weight, with stance. Credibility decides what a slowdown does to
      inflation: believed, a slowdown pulls inflation down (a hard landing);
      not believed, inflation stays high as growth weakens (stagflation). It
      is what tells those two run-ups apart. At equal weight within one
      driver the two cancelled when tight policy lacked credibility, as in
      1969-70, 1973-74, 1978-82, 1988-90 and 2022-25.
    fiscal: >-
      Half weight. Its growth signal overlaps the growth driver's slack:
      deficits widen in downturns and recoveries follow. Impulse and debt
      dynamics together correlate +0.25 with the next three years' inflation
      gap, about +0.5 in each half of 1971-2023. Graded on the next three years, 1993-2023, at full weight
      it lowered the call on top of growth, inflation and monetary policy
      (51% to 43% of regimes right on average, held out); at half weight it
      kept 51% and improved the probabilities.
    reforms: >-
      Half weight. Reforms is there for the long run: the signpost goes with
      faster productivity over the following decade (+0.45, trend removed),
      but with the next three years' growth gap it runs the wrong way (-0.34:
      policy uncertainty spikes in recessions, and recoveries follow). Graded
      on the next three years, 1993-2023, held out, the call is about the same
      at a quarter or half weight and loses about eight points at full weight.
  settings:
    temperature: >-
      0.20. Run-up positions sit close together, so the probabilities are
      modest at any temperature. On the six drivers, held-out log loss is 0.96
      at 0.20 and 0.25, against 1.02 at 0.15 and 0.97 at 0.30; real time
      prefers warmer (1.25 at 0.20, 1.13 at 0.30). The call itself is the
      same at every one of them.
    persistence_months: >-
      Six months since 30 October 2026, three before: two quarters, the rule
      of thumb for a recession, so a new regime has to show up in two
      quarters of data before the call moves. At three months the call
      flipped through short spells in the late 1980s, when the top two
      regimes were often within 25 points of each other (8, 9, 8 and 5-month
      calls from 1987 to 1991). Six months, 1976-2023, with five drivers: 66%
      held out and 68% in real time, against 67% and 66% at three, and 0.29 changes a year against
      0.31. Nine and twelve months fell to 64% and 63% held out and react later
      to real turns. Regraded on the six drivers (31 October 2026), three
      months does slightly better, 73% held out and 65% in real time against
      71% and 64%, within the noise, so six months rests on steadiness and the
      two-quarter rule, not on the grade. Today's call is the same either
      way.
    min_confidence: >-
      0.25. With four scenarios the leader always has at least 25%, so the
      floor never binds; it is kept so a reader can raise it in the control
      room. Set when there were five scenarios: at 0.35 a third of months came
      out transitional and the call lost 14 points held out.
    fit_gate: >-
      Off. The gate asks whether a month is closer to its scenario than a
      neutral economy would be. Run-up positions sit near neutral, so it
      left half of all months unclassified.
    fit_tolerance: >-
      1.25, as in v1; unused while the gate is off.
  theory: >-
    Each scenario as the judgment draws it, slot for slot (-0.67, -0.33,
    0, +0.33, +0.67), on the judgment's own axes: monetary policy as
    credibility, so it sits on the credibility driver, and fiscal policy as
    sustainability (its multiplier line averaged in, which moves only hard
    landing, to -0.33). The judgment has no axis for monetary stance, so
    theory gives none; the outlook page draws it at neutral and says so. A
    direction, not a reading. Not used by the call, which uses prior.
  prior: >-
    The judgment of where each scenario sits, before the data. Growth,
    inflation and reforms keep their direction, and credibility the
    judgment's monetary axis. Monetary stance has no judgment behind it, so
    its prior is neutral for every scenario and its positions come from the
    data. Fiscal policy now reads supportive rather than
    sustainable, so it is placed from each scenario's story: public
    investment crowding in private investment (high growth, high inflation)
    is the most supportive, then goldilocks and stagflation, where deficits
    persist; hard landing sits at neutral. The prior counts as
    half an episode; at one episode or more it pulled the positions outward
    and the call fell from 57% to 40% or less, held out.

regimes:

  goldilocks:
    label: Goldilocks
    short: GLD
    color: "#008300"
    description: A virtuous cycle of investment and returns raises labor productivity; expectations stay anchored.
    prior:
      growth: 0.67
      inflation: 0.00
      monetary: 0.00
      credibility: 0.67
      fiscal: 0.33
      reforms: 0.67
    notes:
      theory: >-
        Growth leads with inflation near the anchor, as theory has it. Policy
        was loose going in (stance -0.35), dovish enough to support growth, as
        in 2001-05 and after the GFC. Credibility sat below theory's: the
        1982-87 run-up, with the 1970s still fresh, read -0.66, the later ones
        about -0.15. Fiscal and reforms did little on average.
      during: >-
        Little changes. Easing fades as the expansion matures, and credibility
        holds near zero, as in every goldilocks spell since 1993.
    theory:
      growth: 0.67
      inflation: 0.00
      credibility: 0.67
      fiscal: 0.67
      reforms: 0.67
    archetype:
      growth: 0.20
      inflation: 0.09
      monetary: -0.31
      credibility: -0.19
      fiscal: 0.06
      reforms: -0.07
    tell: Productivity and capex plans rising together with expectations at target.

  high_growth_high_inflation:
    label: High growth, high inflation
    short: HGHI
    color: "#2a78d6"
    description: Public investment crowds in private; policymakers allow "good" inflation and expectations drift higher.
    prior:
      growth: 0.33
      inflation: 0.33
      monetary: 0.00
      credibility: 0.33
      fiscal: 0.67
      reforms: 0.33
    notes:
      theory: >-
        Growth and inflation as theory has it, but the engine was easy money
        with credibility stretched rather than fiscal: policy about neutral
        going in (-0.07) and credibility well below theory's (-0.56), from the
        1970s to the Fed at zero into 2021. Only 2021-22 was fiscal-led.
      during: >-
        Credibility stays low, -0.5 to -1.0 in every spell, while stance
        swings: loose in 1975-79 and 2021-22, tight in 1988-90 and since
        2023.
    theory:
      growth: 0.33
      inflation: 0.33
      credibility: 0.33
      fiscal: 0.33
      reforms: 0.33
    archetype:
      growth: 0.18
      inflation: 0.72
      monetary: -0.06
      credibility: -0.48
      fiscal: 0.02
      reforms: -0.30
    tell: Investment strong and inflation above target, with credibility stretched.

  stagflation:
    label: Stagflation
    short: STF
    color: "#e34948"
    description: Growth strongly constrained by supply shocks; high realizations unanchor expectations.
    prior:
      growth: -0.67
      inflation: 0.67
      monetary: 0.00
      credibility: -0.67
      fiscal: 0.33
      reforms: -0.67
    notes:
      theory: >-
        The closest fit. Supply shocks (1973, 1979, 1990, 2022) met a Fed that
        had lost its credibility: -0.87 on average in the run-ups to 1969,
        1974, 1981 and 1990, with growth weak. Policy itself was on the tight
        side (+0.25), as in 1977-81: tightening without credibility did not
        bring inflation down.
      during: >-
        The growth outlook turns up as recovery gets priced in, as when
        Volcker's squeeze gave way to the 1982 easing.
    theory:
      growth: -0.67
      inflation: 0.67
      credibility: -0.67
      fiscal: -0.67
      reforms: -0.67
    archetype:
      growth: -0.27
      inflation: 0.82
      monetary: 0.23
      credibility: -0.82
      fiscal: -0.12
      reforms: -0.06
    tell: Expectations rising while credibility and the debt trajectory both weaken.

  hard_landing:
    label: Hard landing
    short: HL
    color: "#eda100"
    description: Strong investment not matched by strong returns; deflationary pressure de-anchors expectations lower.
    prior:
      growth: -0.67
      inflation: -0.67
      monetary: 0.00
      credibility: -0.33
      fiscal: 0.00
      reforms: -0.67
    notes:
      theory: >-
        Demand busts after tightening (the Fed at 6.5% in 2000, 5.25% in
        2006): stance on the tight side going in (+0.22) with credibility
        intact (about zero, where theory has it lower), so the slowdown pulled
        inflation down rather than up. Inflation was a little hot going in
        rather than deflation, and fell below the anchor only at the bottom of
        the GFC. 2020 was Covid, which nothing foresaw.
      during: >-
        The policy response: rates cut and deficits widened, as in 2001, 2009
        and 2020; stance turns loose (-0.4 in 2000-03, -0.6 in 2008-10).
    theory:
      growth: -0.67
      inflation: -0.67
      credibility: -0.33
      fiscal: -0.33
      reforms: -0.67
    archetype:
      growth: -0.15
      inflation: 0.15
      monetary: 0.19
      credibility: 0.01
      fiscal: -0.01
      reforms: 0.10
    tell: Expectations falling below target while growth prospects weaken.

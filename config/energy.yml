# The energy page: is energy demand outrunning supply?
#
# Prototype, built 2 October 2026 for the manager's request to track the energy
# scenario. Scored on its own page (/energy, "Energy (WIP)" in the menu); it does not feed the
# regime model. The proposal is that one number from here, energy tightness,
# enters the supply driver through the twin first.
#
# The frame is ASR's: two markers separate their AI Boom scenario from Energy
# First. One is whether energy demand surges; the other is whether supply
# expands to meet it. Prices check that a gap is really opening, and oil and gas
# are a block of their own, since oil has the clearest history of moving growth
# and inflation.
#
# Scoring is close to the main model's. Each indicator is centered on its own
# average up to `center_to`, signed so that positive means tighter energy (for
# supply, positive means supply expanding, which enters tightness negatively),
# and clipped at ±3. Two departures, because the years to 2019 were unusually
# calm for energy: the spread comes from the full history (`full_spread`), so a
# series that barely moved before 2020 does not read every later move as
# extreme; and a block is tanh(weighted mean / 2), which approaches ±1 without
# sticking there, where the drivers divide by 2 and clip.
#
# History is short: the planned-capacity series start in 2015, and there has
# been one power-demand boom since. Nothing here can be validated by a
# backtest, so each indicator is here because of what it measures.
#
# `why` is shown under each indicator. Keep it to two short paragraphs at most
# (a list of two strings): what the number is, then why it matters.

meta:
  center_to: "2019-12-31"
  full_spread: true
  min_history_months: 36
  min_coverage: 0.5  # a block needs this share of its weight reporting to be scored
  mid_band: 0.15     # scores inside this read as "close to normal", as on the dashboard
  carry_months: 2    # a score holds its last reading this long while its next release is due

blocks:

  power_demand:
    label: Power demand
    question: Is electricity demand surging?
    indicators:
      - id: elec_growth
        short: EIA's demand outlook
        label: Growth in EIA's expected electricity sales, 3 years, annualized
        series: [EN_STEO_ELEC_FWD]
        transform: pct_36m_ann
        sign: 1
        weight: 0.3
        units: "% a year"
        source: EIA Short-Term Energy Outlook
        link: https://www.eia.gov/outlooks/steo/
        why:
          - EIA's forecast of US electricity sales for the next 12 months, against its forecast three years earlier.
          - Forecast against forecast, so weather drops out. Flat from 2009 to 2021, about 2% a year since.
      - id: dc_construction
        short: data center construction
        label: Data center construction spending, % of GDP
        series: [EN_CENSUS_DC]
        transform: share
        denominator: GDP
        factor: 0.1        # $ millions over $ billions, as a percent
        sign: 1
        weight: 0.2
        units: "% of GDP"
        source: Census Bureau, construction spending
        link: https://www.census.gov/construction/c30/data/index.html
        why:
          - Private spending on data center construction, at an annual rate.
          - Buildings going up now are power demand in one to three years.
      - id: it_investment
        short: server investment
        label: Investment in computers and servers, % of GDP
        series: [B935RC1Q027SBEA]
        transform: share
        denominator: GDP
        factor: 100
        sign: 1
        weight: 0.15
        units: "% of GDP"
        source: BEA, via FRED
        link: https://fred.stlouisfed.org/series/B935RC1Q027SBEA
        why:
          - Business spending on computers and peripherals, which now means AI servers.
          - The equipment that fills the data centers, and draws the power.
      - id: mfg_construction
        short: factory construction
        label: Factory construction spending, % of GDP
        series: [PRMFGCONS]
        transform: share
        denominator: GDP
        factor: 0.1
        sign: 1
        weight: 0.15
        units: "% of GDP"
        source: Census Bureau, via FRED
        link: https://fred.stlouisfed.org/series/PRMFGCONS
        why:
          - Private spending on manufacturing plants, led by chip and battery fabs.
          - Demand beyond AI, and power-hungry once the plants run.
      - id: ci_sales_growth
        short: business power sales
        label: Commercial and industrial electricity sales, 3-year growth, annualized
        series: [EN_EIA_CI_SALES]
        transform: pct_36m_ann
        sum_months: 12
        sign: 1
        weight: 0.2
        units: "% a year"
        source: EIA electricity data
        link: https://www.eia.gov/electricity/data/browser/
        why:
          - Power actually sold to businesses, summed over 12 months.
          - The check that forecast demand is turning into real load.

  power_supply:
    label: Power supply
    question: Is supply expanding to meet it?
    indicators:
      - id: firm_net_additions
        short: firm capacity pipeline
        label: Firm capacity due in the next 3 years, net of retirements, % of the firm fleet
        series: [EN_860M_FIRM_NET_ADD]
        transform: level
        sign: 1
        weight: 0.45
        units: "%"
        source: EIA Form 860M
        link: https://www.eia.gov/electricity/data/eia860m/
        why:
          - Planned plants less retirements, each counted at what it delivers at the summer peak.
          - A solar megawatt counts about a tenth of a nuclear one, so this asks about dependable supply.
      - id: cancel_share
        short: cancellations
        label: Share of planned capacity canceled or postponed
        series: [EN_860M_CANCEL_SHARE]
        transform: level
        sign: -1
        weight: 0.2
        units: "%"
        source: EIA Form 860M
        link: https://www.eia.gov/electricity/data/eia860m/
        why:
          - Projects dropped or delayed, against those still planned.
          - A rising share means the pipeline is leaking.
      - id: power_construction
        short: grid construction
        label: Power plant and grid construction spending, % of GDP
        series: [PRPWRCONS]
        transform: share
        denominator: GDP
        factor: 0.1
        sign: 1
        weight: 0.35
        units: "% of GDP"
        source: Census Bureau, via FRED
        link: https://fred.stlouisfed.org/series/PRPWRCONS
        why:
          - Private spending on generation, transmission and distribution.
          - Money actually being spent, where planned capacity is only intent.

  power_prices:
    label: Power-sector prices
    question: Is the gap showing in prices?
    indicators:
      - id: grid_equipment
        short: grid equipment prices
        label: Transformer and switchgear prices vs. all producer prices, 3-year change
        series: [PCU335311335311, PCU335313335313]
        deflator: PPIACO
        transform: rel_36m_ann
        sign: 1
        weight: 0.35
        units: "% a year"
        source: BLS producer prices, via FRED
        link: https://fred.stlouisfed.org/series/PCU335311335311
        why:
          - The equipment every new connection needs, priced against everything else.
          - A scarcity price for building the grid.
      - id: pjm_capacity
        short: PJM capacity prices
        label: PJM capacity price for the latest delivery year auctioned
        series: [EN_PJM_CAPACITY]
        transform: level
        sign: 1
        weight: 0.3
        units: $/MW-day
        source: Monitoring Analytics, PJM State of the Market
        link: https://www.monitoringanalytics.com/reports/PJM_State_of_the_Market/2025.shtml
        why:
          - What the largest US grid pays to have capacity available one to three years out.
          - A market price for scarcity, where data center load is growing fastest.
      - id: business_power_price
        short: business power prices
        label: Electricity prices paid by business vs. all producer prices, 3-year change
        series: [WPU0542, WPU0543]
        deflator: PPIACO
        transform: rel_36m_ann
        sign: 1
        weight: 0.15
        units: "% a year"
        source: BLS producer prices, via FRED
        link: https://fred.stlouisfed.org/series/WPU0542
        why:
          - Commercial and industrial power prices, the rates data centers pay.
          - Regulated prices move slowly, so a rise here has staying power.
      - id: copper
        short: copper
        label: Copper vs. all producer prices, 3-year change
        series: [PCOPPUSDM]
        deflator: PPIACO
        transform: rel_36m_ann
        sign: 1
        weight: 0.2
        units: "% a year"
        source: IMF commodity prices, via FRED
        link: https://fred.stlouisfed.org/series/PCOPPUSDM
        why:
          - The metal in wiring, transformers and generators.
          - Also a global growth price, hence the lower weight.

  fuels:
    label: Oil and gas
    question: Is fuel supply tight?
    indicators:
      - id: opec_spare
        short: OPEC spare capacity
        label: OPEC spare capacity EIA expects, next 12 months, last 3 outlooks
        series: [EN_STEO_OPEC_SPARE]
        smooth_months: 3   # average of the last three outlooks
        transform: level
        sign: -1
        weight: 0.3
        units: million b/d
        source: EIA Short-Term Energy Outlook
        link: https://www.eia.gov/outlooks/steo/
        why:
          - The world's buffer against a supply shock.
          - With little spare, a shock goes straight to price.
      - id: oil_draws
        short: the 12-month oil balance
        label: World oil inventory draws EIA expects, next 12 months, last 3 outlooks
        series: [EN_STEO_OIL_DRAW]
        smooth_months: 3   # average of the last three outlooks
        transform: level
        sign: 1
        weight: 0.15
        units: million b/d
        source: EIA Short-Term Energy Outlook
        link: https://www.eia.gov/outlooks/steo/
        why:
          - Positive means stocks are expected to fall, a tightening balance.
          - Negative means they are expected to build.
      - id: oecd_stocks
        short: OECD oil stocks
        label: OECD commercial oil stocks vs. the same month over the last 5 years
        series: [EN_STEO_OECD_STOCKS]
        transform: dev_5y_same_month_pct
        sign: -1
        weight: 0.2
        units: "%"
        source: EIA Short-Term Energy Outlook
        link: https://www.eia.gov/outlooks/steo/
        why:
          - Oil actually in storage in rich countries, against the usual level for the time of year.
          - Below normal means less cushion, which reads as tight.
      - id: gas_price
        short: the gas price outlook
        label: Henry Hub price EIA expects vs. its 5-year average, last 3 outlooks
        series: [EN_STEO_HENRY_HUB]
        smooth_months: 3   # average of the last three outlooks
        transform: dev_5y_pct
        sign: 1
        weight: 0.2
        units: "%"
        source: EIA Short-Term Energy Outlook
        link: https://www.eia.gov/outlooks/steo/
        why:
          - The fuel for new gas plants.
          - Through LNG exports, also the link to the world gas market.
      - id: geopolitical_risk
        short: geopolitical risk
        label: Geopolitical risk index, 12-month average
        series: [EN_GPR]
        transform: mean_12m
        sign: 1
        weight: 0.15
        units: index
        source: Caldara and Iacoviello, Federal Reserve Board
        link: https://www.matteoiacoviello.com/gpr.htm
        why:
          - Newspaper coverage of wars, threats and terrorism, 1985-2019 average = 100.
          - The Middle East channel, one of ASR's two reasons for raising Energy First.

# How the blocks combine. Power tightness is demand pressure, less supply
# expanding, plus prices; energy tightness weighs power against fuels. Both sets
# of weights are opinions, set even until argued otherwise.
combine:
  power: {power_demand: 1, power_supply: -1, power_prices: 1}
  energy: {power: 0.5, fuels: 0.5}

# Shown on the page, not scored.
context:
  - id: epoch_pipeline
    series: EN_EPOCH_US_POWER
    label: Power of the large US AI data centers Epoch tracks, built and planned
    units: GW
    source: Epoch AI, Frontier Data Centers (CC BY)
    link: https://epoch.ai/data/data-centers
    why:
      - Frontier AI sites only, about 43% of global AI compute by Epoch's estimate.
      - No history of earlier estimates, so it is not scored. A copy is kept at each update from October 2026.

# Read from published reports by hand; cited, not scored. Update when a new
# report is out, and keep the citation with the number.
manual:
  - label: Data center capacity under construction, primary North American markets
    value: "7,481 MW, a record, up 24.8% in H1"
    as_of: H1 2026
    source: CBRE, North America Data Center Trends H1 2026
    link: https://www.cbre.com/insights/books/north-america-data-center-trends-h1-2026
  - label: Data center vacancy, primary markets
    value: "1.4%, a record low"
    as_of: H1 2026
    source: CBRE, North America Data Center Trends H1 2026
    link: https://www.cbre.com/insights/books/north-america-data-center-trends-h1-2026
  - label: Utilities' 5-year forecast of US peak load growth
    value: "166 GW, about 90 GW of it data centers (24 GW three years earlier)"
    as_of: 2025 report
    source: Grid Strategies, National Load Growth Report 2025
    link: https://gridstrategiesllc.com/wp-content/uploads/Grid-Strategies-National-Load-Growth-Report-2025.pdf

# Proposed and not yet in, with what stands in the way.
pending:
  - item: Utilities' capex-to-sales, 12 months forward (ASR's Chart 4)
    blocker: Bloomberg API access is on hold pending Bloomberg's review.
  - item: Hyperscaler capex revisions (MSFT, GOOGL, AMZN, META, ORCL)
    blocker: Bloomberg, as above.
  - item: Energy majors' 3-year capex revision, moved here from the supply driver
    blocker: Bloomberg, as above.
  - item: Brent and Henry Hub 2-3 years forward
    blocker: Macrobond coverage not yet checked.
  - item: Grid interconnection queue (Berkeley Lab's Queued Up, annual since about 2010)
    blocker: The file sits behind a browser check and cannot be fetched automatically; download it once a year.
  - item: Live queue totals by grid region (interconnection.fyi)
    blocker: Free and crawlable, but today's totals only; history would build from when archiving starts.

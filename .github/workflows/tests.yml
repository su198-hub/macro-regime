# Runs on every push: the unit tests, then the whole dashboard headlessly on
# demo data, on the pinned versions the hosted app boots with
# (requirements.txt), so a broken page fails here instead of on the hosted app.
# Weekly, the "latest" job tries the newest releases of the direct
# dependencies (requirements.in), so an upgrade that breaks something shows up
# before the pins are moved.

name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - name: Dashboard renders on demo data
        env:
          MACRO_REGIME_DB: ${{ runner.temp }}/ci.duckdb
          MACRO_REGIME_SEED_DEMO: "1"
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=120).run()
          errors = [e.value for e in at.exception]
          assert not errors, errors
          html = [h.proto.body for h in at.get("html")]
          assert any("sp-row" in b for b in html), "signpost chart missing"
          assert any("mr-prob" in b for b in html), "regime probabilities missing"
          assert len(at.tabs) == 4, "detail tabs missing"
          assert any("Contribution to driver" in b for b in html), "drill-down missing"

          # Any confirmed month can be examined, not only the latest.
          labels = [s.label for s in at.selectbox]
          assert "Year" in labels and "Month" in labels, f"month picker missing: {labels}"
          # The country menu offers every country whose config is in place.
          menu = [s for s in at.selectbox if s.label == "Country"]
          assert menu and menu[0].options, "country menu missing"
          month = at.selectbox[1]
          month.select(month.options[0]).run()
          assert not [e.value for e in at.exception], [e.value for e in at.exception]

          at.switch_page("views/control.py").run()
          errors = [e.value for e in at.exception]
          assert not errors, errors
          body = "".join(h.proto.body for h in at.get("html"))
          assert "What cannot be changed here" in body, "control room incomplete"
          assert at.toggle and at.slider and at.number_input, "controls missing"
          # Changing an assumption must reach the dashboard, and only for this session.
          # Set and submit in one run, as a browser does: since Streamlit 1.66 a form
          # widget changed in one run and submitted in the next is discarded.
          at.slider(key="sal::us::growth").set_value(2.0)
          [b for b in at.button if b.label == "Apply salience"][0].click().run()
          assert not [e.value for e in at.exception], [e.value for e in at.exception]
          assert at.session_state["mr_overrides"]["us"]["salience"]["growth"] == 2.0, \
              "override lost"
          at.switch_page("views/dashboard.py").run()
          assert any('class="mr-custom"' in h.proto.body for h in at.get("html")), \
              "no custom settings banner"
          [b for b in at.button if "Reset" in b.label][0].click().run()
          assert not at.session_state["mr_overrides"]["us"]["salience"], "reset did not clear"

          at.switch_page("views/methodology.py").run()
          errors = [e.value for e in at.exception]
          assert not errors, errors
          body = "".join(h.proto.body for h in at.get("html"))
          assert "m-example" in body and "m-table" in body, "methodology incomplete"
          assert "Against simple benchmarks" in body, "the call's record did not render"

          at.switch_page("views/bench.py").run()
          errors = [e.value for e in at.exception]
          assert not errors, errors
          from src import bench as bn
          rows = bn.rows(bn.load("config/bench.yml"))
          boxes = [c for c in at.checkbox if c.key and c.key.startswith("bench::")]
          assert len(boxes) == len(rows), "a bench row rendered no checkbox"
          ticked = {c.key.removeprefix("bench::") for c in boxes if c.value}
          assert ticked == set(bn.opening_ids(bn.load("config/bench.yml"))), \
              "the bench does not open on the scored set plus its preselected candidates"
          # Ticking is for discussion: it must never reach the model.
          cand = next(r for r in rows if r.get("status") == "candidate")
          at.checkbox(key=f"bench::{cand['id']}").set_value(True).run()
          assert not [e.value for e in at.exception], [e.value for e in at.exception]
          assert "1 added" in "\n".join(c.value for c in at.code), "export did not update"
          held = at.session_state["mr_overrides"] if "mr_overrides" in at.session_state else {}
          # A reset leaves empty sections behind, so count settings, not keys.
          from src.overrides import count
          assert count((held or {}).get("us") or {}) == 0, "the bench wrote an override"

          # The regime explorer, on the demo answer key: every jump, the
          # turning points and false alarms included, must render.
          at.switch_page("views/outlook.py").run()
          errors = [e.value for e in at.exception]
          assert not errors, errors
          body = "".join(h.proto.body for h in at.get("html"))
          assert "Go back in time" in body and "gp-card" in body, "explorer incomplete"
          jump = [s for s in at.selectbox if s.label.startswith("Jump")]
          assert jump and len(jump[0].options) > 2, "explorer jump list missing"
          for option in jump[0].options[1:]:
              at.selectbox(key="hx_turn").select(option).run()
              errors = [e.value for e in at.exception]
              assert not errors, (option, errors)

          # A framework chosen on the dashboard survives a visit to a page
          # that does not draw the menu.
          at.switch_page("views/dashboard.py").run()
          menu = [s for s in at.selectbox if s.label == "Framework"]
          assert menu, "framework menu missing"
          # options are the menu's labels; the value is the framework's id.
          from src import countries as ctry
          ids = list(ctry.resolve(ctry.load_registry(), "us")["frameworks"])
          other = [f for f in ids if f != menu[0].value][0]
          menu[0].set_value(other).run()
          at.switch_page("views/outlook.py").run()
          at.switch_page("views/dashboard.py").run()
          assert [s for s in at.selectbox if s.label == "Framework"][0].value == other,               "framework choice lost on switching pages"

          print("Rendered the dashboard, control room, methodology, bench and regime explorer")
          EOF

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.in pytest
      - run: python -m pytest tests/ -q
